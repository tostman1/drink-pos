services:
  drink-pos:
    # Fertiges App-Image aus GitHub Container Registry.
    # Kann in .env mit DRINK_POS_IMAGE=... ueberschrieben werden.
    image: "${DRINK_POS_IMAGE:-ghcr.io/tostman1/drink-pos:stable}"
    # Compose kennt kein "newer" wie `podman pull --policy newer`.
    # `always` prueft beim Start die Registry; unveraenderte Images bleiben gecacht.
    pull_policy: always
    container_name: drink-pos
    restart: unless-stopped

    # Host-Port 8088 zeigt auf Uvicorn im Container.
    ports:
      - "8088:8000"

    # Nur persistente Daten mounten; der App-Code liegt bereits im Image.
    volumes:
      - ./data:/app/data

    environment:
      TZ: "${TZ:-Europe/Zurich}"
      DRINK_POS_PIN: "${DRINK_POS_PIN:-1423}"
      DRINK_POS_ENV: "${DRINK_POS_ENV:-production}"
      # Leer lassen entspricht der alten Logik:
      # production  => /app/data/drink_pos.db
      # development => /app/data/drink_pos_dev.db
      # Bei Bedarf in .env manuell setzen, z.B. DRINK_POS_DB=/app/data/custom.db.
      DRINK_POS_DB: "${DRINK_POS_DB:-}"
      # Leer lassen deaktiviert die Agenten-API.
      DRINK_POS_AGENT_TOKEN: "${DRINK_POS_AGENT_TOKEN:-}"
      # SumUp Solo Self-Checkout. API-Key nur serverseitig setzen.
      PAYMENT_PROVIDER: "${PAYMENT_PROVIDER:-}"
      SUMUP_API_BASE: "${SUMUP_API_BASE:-https://api.sumup.com}"
      SUMUP_API_KEY: "${SUMUP_API_KEY:-}"
      SUMUP_MERCHANT_CODE: "${SUMUP_MERCHANT_CODE:-}"
      SUMUP_READER_ID: "${SUMUP_READER_ID:-}"
      SUMUP_AFFILIATE_KEY: "${SUMUP_AFFILIATE_KEY:-}"
      SUMUP_AFFILIATE_APP_ID: "${SUMUP_AFFILIATE_APP_ID:-}"
      SUMUP_CURRENCY: "${SUMUP_CURRENCY:-EUR}"
      SUMUP_TIMEOUT_SECONDS: "${SUMUP_TIMEOUT_SECONDS:-120}"

  drink-pos-backup:
    # Gleiches Image, aber anderer Startbefehl fuer den Backup-Scheduler.
    image: "${DRINK_POS_IMAGE:-ghcr.io/tostman1/drink-pos:stable}"
    # Siehe Kommentar beim App-Service.
    pull_policy: always
    container_name: drink-pos-backup
    restart: unless-stopped
    depends_on:
      - drink-pos

    # Backups landen unter ./data/backups und bleiben hostseitig erhalten.
    volumes:
      - ./data:/app/data

    environment:
      TZ: "${TZ:-Europe/Zurich}"
      DRINK_POS_PIN: "${DRINK_POS_PIN:-1423}"
      DRINK_POS_ENV: "${DRINK_POS_ENV:-production}"
      DRINK_POS_DB: "${DRINK_POS_DB:-}"
      DRINK_POS_BACKUP_DIR: "${DRINK_POS_BACKUP_DIR:-/app/data/backups}"

    # Jeden Freitag um 03:00 ein Backup schreiben; danach etwas laenger schlafen,
    # damit derselbe Minuten-Slot nicht mehrfach ausloest.
    command: >
      sh -c "echo 'Drink POS backup scheduler active: Friday 03:00';
             while true; do
               if [ \"$$(date +%u)\" = '5' ] && [ \"$$(date +%H%M)\" = '0300' ]; then
                 python /app/backup_database.py;
                 sleep 3700;
               fi;
               sleep 30;
             done"
