services:
  drink-pos:
    image: "${DRINK_POS_IMAGE:?Set DRINK_POS_IMAGE=ghcr.io/<github-owner>/drink-pos:latest}"
    pull_policy: always
    container_name: drink-pos
    restart: unless-stopped
    labels:
      io.containers.autoupdate: registry
    ports:
      - "8088:8000"
    volumes:
      - ./data:/app/data
    environment:
      TZ: "${TZ:-Europe/Vienna}"
      DRINK_POS_PIN: "${DRINK_POS_PIN:-1234}"
      DRINK_POS_ENV: "${DRINK_POS_ENV:-production}"
      DRINK_POS_DB: "${DRINK_POS_DB:-/app/data/drink_pos.db}"
      DRINK_POS_BACKUP_DIR: "${DRINK_POS_BACKUP_DIR:-/app/data/backups}"
      DRINK_POS_AGENT_TOKEN: "${DRINK_POS_AGENT_TOKEN:-}"

  drink-pos-backup:
    image: "${DRINK_POS_IMAGE:?Set DRINK_POS_IMAGE=ghcr.io/<github-owner>/drink-pos:latest}"
    pull_policy: always
    container_name: drink-pos-backup
    restart: unless-stopped
    labels:
      io.containers.autoupdate: registry
    depends_on:
      - drink-pos
    volumes:
      - ./data:/app/data
    environment:
      TZ: "${TZ:-Europe/Vienna}"
      DRINK_POS_PIN: "${DRINK_POS_PIN:-1234}"
      DRINK_POS_ENV: "${DRINK_POS_ENV:-production}"
      DRINK_POS_DB: "${DRINK_POS_DB:-/app/data/drink_pos.db}"
      DRINK_POS_BACKUP_DIR: "${DRINK_POS_BACKUP_DIR:-/app/data/backups}"
    command: >
      sh -c "echo 'Drink POS backup scheduler active: Friday 03:00';
             while true; do
               if [ \"$$(date +%u)\" = '5' ] && [ \"$$(date +%H%M)\" = '0300' ]; then
                 python /app/backup_database.py;
                 sleep 3700;
               fi;
               sleep 30;
             done"
