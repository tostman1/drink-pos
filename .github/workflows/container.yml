name: Verify container and gated publication

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Owner-approved production image publication (main only)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  verify:
    name: Non-publishing container verification
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate production Compose templates without starting services
        env:
          SUMUP_API_KEY: ""
          SUMUP_MERCHANT_CODE: ""
          SUMUP_READER_ID: ""
          SUMUP_AFFILIATE_KEY: ""
          SUMUP_AFFILIATE_APP_ID: ""
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.synology.yaml config --quiet
          DRINK_POS_IMAGE=drink-pos:verification DRINK_POS_CONFIG_FILE=/dev/null DRINK_POS_SECRET_FILE=/dev/null DRINK_POS_BACKUP_VOLUME=verification-backups docker compose -f examples/compose.recovery.yaml config --quiet
          DRINK_POS_IMAGE=example.invalid/drink-pos@sha256:$(printf '%064d' 0) DRINK_POS_CONFIG_FILE=/dev/null DRINK_POS_SECRET_FILE=/dev/null DRINK_POS_STATE_VOLUME=verification-state docker compose -f examples/compose.upgrade.yaml config --quiet
      - name: Build local-only verification image
        run: >-
          docker build --platform linux/amd64 --tag drink-pos:verification
          --build-arg BUILD_COMMIT="$GITHUB_SHA"
          --build-arg BUILD_REF=verification
          --build-arg BUILD_CHANNEL=verification
          --build-arg BUILD_TAGS=verification .
      - name: Verify startup, routes, metadata, SQLite and restart persistence
        run: python scripts/container_smoke.py --image drink-pos:verification --expected-commit "$GITHUB_SHA"
      - name: Inspect offline release identity and rehearse synthetic upgrade in actual image
        run: |
          docker run --rm --network none --pull never --entrypoint python drink-pos:verification -B -c "import os,json; from release_identity import release_identity; assert os.environ['APP_BUILD_COMMIT']=='$GITHUB_SHA'; print(json.dumps(release_identity(os.environ['APP_BUILD_COMMIT'],os.environ['APP_BUILD_CHANNEL'],None),sort_keys=True))"
          docker run --rm --network none --pull never --entrypoint python --mount type=bind,source="$PWD/scripts",target=/verification,readonly drink-pos:verification -B /verification/upgrade_rehearsal.py --target /tmp/rl01-synthetic --commit "$GITHUB_SHA" --synthetic-only
      - name: Verify opt-in versioned adoption and independent recovery in actual image
        run: docker run --rm --network none --pull never --entrypoint python --mount type=bind,source="$PWD/scripts",target=/verification,readonly drink-pos:verification -B /verification/migration_rehearsal.py --target /tmp/rl02-synthetic --commit "$GITHUB_SHA" --synthetic-only
      - name: Verify historical preservation and served financial scenario in actual image
        run: docker run --rm --network none --pull never --entrypoint python --mount type=bind,source="$PWD/scripts",target=/verification,readonly drink-pos:verification -B /verification/financial_rehearsal.py --target /tmp/rl04-synthetic --commit "$GITHUB_SHA" --synthetic-only
      - name: Install checksum-pinned external disaster-recovery encryption tooling
        run: python scripts/install_age.py --destination "$RUNNER_TEMP/drink-pos-age" --github-path "$GITHUB_PATH"
      - name: Rehearse independent encrypted recovery after complete synthetic installation loss
        run: python scripts/disaster_rehearsal.py --image drink-pos:verification --expected-commit "$GITHUB_SHA"
      - name: Audit actual image runtime dependencies without running app code
        run: |
          python -m pip install pip-audit==2.10.1
          docker run --rm --network none --pull never --entrypoint python drink-pos:verification -m pip freeze > "$RUNNER_TEMP/image-requirements.txt"
          python -m pip_audit --strict --disable-pip --no-deps --progress-spinner off -r "$RUNNER_TEMP/image-requirements.txt"
      - name: Rehearse exact isolated Synology test Compose deliverable
        run: |
          git archive 25a78ba6606e74760969cce7c993d60d3a139f2e | docker build --platform linux/amd64 --tag drink-pos:rl06-baseline --build-arg BUILD_COMMIT=25a78ba6606e74760969cce7c993d60d3a139f2e --build-arg BUILD_REF=rl06-baseline --build-arg BUILD_CHANNEL=verification -
          git archive 2cc36fd69ec56dbdfe65ffb7ed98600d7c33b7c4 | docker build --platform linux/amd64 --tag drink-pos:rl06-unsupported-v1 --build-arg BUILD_COMMIT=2cc36fd69ec56dbdfe65ffb7ed98600d7c33b7c4 --build-arg BUILD_CHANNEL=verification -
          python scripts/synology_test_rehearsal.py --image drink-pos:verification --commit "$GITHUB_SHA" --baseline-image drink-pos:rl06-baseline --unsupported-image drink-pos:rl06-unsupported-v1 --target "$RUNNER_TEMP/rl06-compose"
      - name: Export already tested AMD64 image and exact identity receipt (no publication)
        run: python scripts/export_test_image.py --image drink-pos:verification --commit "$GITHUB_SHA" --destination "$RUNNER_TEMP/rl06-artifact" --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload non-production exact-image installation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drink-pos-test-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/rl06-artifact/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain synthetic test deployment evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rl06-synthetic-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/rl06-compose/evidence/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Explicit owner-triggered main publication
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main' }}
    needs: [checks, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Owner must configure required reviewers; naming an environment is not approval.
    environment: production-images
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Normalize image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/drink-pos" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=stable
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=sha-
      - name: Build and publish owner-approved image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_REF=main
            BUILD_CHANNEL=stable
            BUILD_TAGS=stable,latest,main
