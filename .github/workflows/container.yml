name: Build container image

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/drink-pos

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/drink-pos" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        run: python -m unittest discover -s tests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Collect build metadata
        id: build_meta
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          ref_name="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            channel="stable"
            tags="stable,latest,main,sha-${short_sha}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            channel="$ref_name"
            tags="${ref_name},sha-${short_sha}"
          else
            channel="$ref_name"
            tags="${ref_name},sha-${short_sha}"
          fi
          {
            echo "ref=${ref_name}"
            echo "channel=${channel}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_REF=${{ steps.build_meta.outputs.ref }}
            BUILD_CHANNEL=${{ steps.build_meta.outputs.channel }}
            BUILD_TAGS=${{ steps.build_meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
