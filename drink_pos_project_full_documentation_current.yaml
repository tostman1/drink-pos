      - "Status CREATED, SENT_TO_READER oder PENDING sperrt die Person gegen weitere Buchungen, Kassa-Zahlungen, Kassensturz und Rundenabzug."
      - "Nach erfolgreichem SumUp-Status wird expected_revision erneut geprueft; nur unveraenderte Rechnungen werden automatisch als PAID_SUMUP gebucht."
    connection_recovery:
      - "self-pay.html speichert laufende client_payment_id in localStorage."
      - "Nach Reload/Funkloch pollt die Seite GET /api/self-pay/payment/{client_payment_id}."
      - "created/sent_to_reader/pending/paid/failed/cancelled/timeout/unknown/expired sind die oeffentlichen Statuswerte."
    docs:
      - "README.md"
      - "docs/self-payment-sumup.md"
      - "docs/agent-api.md"

current_update_2026_05_18:
  cache_name: "drink-pos-shell-v73"
  branch_note: "Historischer Stand inklusive versteckter Handy-Kassa unter /kassa, Container-Deployment und Agenten-REST-API."
  mobile_kassa:
    route: "/kassa"
    linked_from_standard_view: false
    target_device: "Handy im Hochformat"
    workflow:
      - "Kassierer oeffnet bekannte URL /kassa."
      - "Admin-PIN einmal eingeben; PIN bleibt nur in sessionStorage dieser Browser-Sitzung."
      - "Name in kompakter Liste waehlen; nur Name, offene Striche und Betrag sind sichtbar."
      - "Detailansicht zeigt konsumierte Getraenke gruppiert mit Menge, Einzelpreis und Summe."
      - "'Bezahlt' oeffnet eine zweite Bestaetigung; erst 'Ja, bezahlt' schreibt PAID_CASH und setzt die offenen order_lines dieser Person auf quantity=0."
      - "'Abbrechen' kehrt ohne Aenderung zur Liste zurueck."
    conflict_protection:
      - "/api/kassa/person/{person_id} liefert eine revision aus offenen Zeilen und offenen Loeschanfragen."
      - "/api/kassa/pay akzeptiert nur, wenn expected_revision noch aktuell ist."
      - "Bei paralleler Buchung antwortet der Server mit HTTP 409 und aktuellem Stand; die Seite aktualisiert die Detailansicht statt zu bezahlen."
      - "Beim Zahlungsvorgang nutzt der Server BEGIN IMMEDIATE, damit zwischen Pruefung und Streichung keine weitere Buchung dazwischen schreibt."
  round_flow:
    current_behavior:
      - "Benutzer drueckt im Personen-Popup 'Runde zahlen' / '+ 1 Runde bestaetigen'."
      - "Es erscheint eine Bestaetigung, dass die Runde sofort auf die offene Rechnung gebucht wird."
      - "Backend schreibt sofort ROUND_REQUEST_APPROVED und einen offenen Systemartikel '1 Runde'."
      - "Keine Admin-Genehmigung fuer Runden mehr noetig."
      - "Falls eine Runde irrtuemlich eingetragen wurde, kann sie per Loeschanfrage entfernt werden."
    cashup_automation:
      - "Kassensturz-Preview erkennt offene event_open Systemposten '1 Runde'."
      - "Pro bestaetigter Runde wird fuer jede aktive Person das guenstigste verfuegbare normale Getraenk der aktuellen Strichliste abgezogen."
      - "Mengen, die bereits in offenen Loeschanfragen reserviert sind, werden beim automatischen Abzug nicht verwendet."
      - "Beim Ausfuehren werden ROUND_DEDUCTED, transaction_items und round_events geschrieben."
      - "Danach wird die verbleibende aktuelle Strichliste mit CASHUP geschlossen."
  statistics:
    endpoint: "POST /api/admin/statistics"
    filters:
      - "scope: today, event, month, all, custom"
      - "date_from/date_to fuer benutzerdefinierte Zeitraeume"
      - "include_admin_items"
    blocks:
      - "Zusammenfassungsleiste: Zeitraum-Ergebnis, offene Summe, aktuelle Strichliste, Verbrauch"
      - "Automatische Hinweise: Top-Artikel, groesster offener Betrag, Anteil aktuelle Strichliste"
      - "KPI-Zeile: offene Summe, aktuelle Strichliste, Verbrauch, Bar bezahlt, Kosten, Gewinn, Runden"
      - "Top-Artikel nach konsumierter Menge"
      - "Offene Betraege nach Person"
      - "Umsatz/Kosten/Gewinn nach Zahlungsdatum"
      - "Runden und Anfragen"
      - "Artikeldetails mit Suchfilter und Summenzeile"
    use_case_examples:
      - "Top-Artikel: Statistik -> Zeitraum waehlen -> Top-Artikel und Artikeldetails pruefen."
      - "Offene Betraege: Statistik -> Heute/Gesamt waehlen -> Offen nach Person pruefen."
    performance:
      - "Statistik-Zeitraeume werden in SQL nach timestamp gefiltert."
      - "Indizes auf transaction_items, order_lines, round_events, transactions, order_lines(person_id, quantity, event_open), change_requests(order_line_id, status) und round_requests(person_id, status) beschleunigen wiederholte Auswertungen."
  technical_hardening:
    database:
      - "get_conn setzt PRAGMA foreign_keys=ON pro SQLite-Verbindung."
      - "get_conn setzt PRAGMA busy_timeout=15000 pro Verbindung."
      - "get_conn ist ein echter Context Manager und schliesst Verbindungen nach jedem Request."
    security:
      - "/api/transactions ist PIN-pflichtig."
      - "Admin-Login hat ein einfaches Rate Limit."
      - "DB-Pfad wird in production nicht mehr in public health/config Antworten offengelegt."
    deployment:
      - "requirements.txt, .env.example und README.md ergaenzt."
    tests:
      - "tests/test_backend.py deckt Buchung, Zahlung, mobile Kassa-Revisionskonflikte, Kassensturz, Runde, Offline-Idempotenz, Mitgliedernachrichten, Production-Standard-PIN-Block, PRAGMAs und /api/transactions-Schutz ab."
  cost_warning_and_messages:
    settings:
      - "cost_warning_enabled / cost_warning_threshold_eur"
      - "payment_reminder_enabled / payment_reminder_threshold_eur"
      - "cost_notice_show_on_overview / cost_notice_show_in_popup"
      - "member_messages_show_on_overview / member_messages_show_in_popup"
    cashier_behavior:
      - "Personenkarten zeigen Warnungs-/Erinnerungs-Badge nur, wenn die Standardansicht-Anzeige aktiviert ist."
      - "Personen-Popup zeigt Kostenwarnung oder Zahlungserinnerung nur, wenn die Popup-Anzeige aktiviert ist."
      - "Admin-Nachrichten an Mitglieder erscheinen je nach Setting in Standardansicht und/oder Personen-Popup."
      - "Nachrichten in der Standardansicht sind reine Hinweise; bestaetigt wird ausschliesslich im Personen-Popup."
    admin_behavior:
      - "Admin kann Nachrichten mit Empfaengerauswahl an aktive Mitglieder anlegen und aktive Nachrichten archivieren; die Einstellungen zeigen keinen Nachrichtenverlauf unterhalb der Erstellung."
      - "Alte Nachrichten bleiben ueber den normalen Verlauf bzw. die Datenbank-Transaktionen nachvollziehbar."
      - "Admin kann fuer Kostenhinweise und Mitgliedernachrichten getrennt festlegen, ob sie in Standardansicht und/oder Personen-Popup sichtbar sind."
      - "Admin-Einstellungen haben einfache Ansicht/Expertenmodus und aufklappbare Darstellungsgruppen."
  sync:
    heartbeat_seconds: 5
    behavior:
      - "Heartbeat fragt nur /api/sync-status ab und ist deshalb leichtgewichtig."
      - "Nur bei geaenderter db_revision werden Daten neu geladen."
      - "Automatische Hintergrund-Syncs schreiben keinen SYNC_COMPLETED-Verlaufseintrag mehr."
      - "Manuelle Synchronisation und Wiederverbindung koennen weiterhin geloggt werden."
      - "Client-Events enthalten device_info, z. B. iPad, iPhone, PC Windows, Aufloesung und Plattform."
      - "Bei haengendem Sync wird Auto-Reconnect versucht; nach laengerem Haenger kontrollierter Reload mit Cooldown."
      - "Normale Offline-Getraenkebuchungen werden lokal vorgemerkt und bei Wiederverbindung chronologisch gesendet."
    pull_to_refresh:
      enabled: true
      behavior: "Wenn am oberen Rand weiter nach unten gezogen und losgelassen wird, synchronisiert die Seite manuell."
    ipad_fullscreen_safe_area:
      implemented: true
      behavior: "viewport-fit=cover und Header-Padding mit safe-area-inset-top verhindern durchsichtige Statusleistenbereiche ueber dem Header."

bedienszenarien_und_bedienreihenfolgen:
  normaler_getraenkekonsum:
    steps:
      - "Kassenansicht oeffnen."
      - "Person antippen."
      - "Gewuenschtes Getraenk antippen."
      - "Bei Bedarf weitere Getraenke antippen."
      - "'Fertig' antippen oder ausserhalb des Popups tippen."
    expected_result:
      - "Getraenk erscheint sofort auf der offenen Rechnung."
      - "Aktuelle Strichliste zeigt neue Striche."
      - "Andere Geraete sehen die Aenderung nach spaetestens ca. 5 Sekunden oder sofort nach Pull-to-refresh."
  offline_getraenkekonsum:
    constraints:
      - "Nur normale Getraenkebuchungen, kein Adminmodus und kein Systemartikel '1 Runde'."
      - "Mindestens ein vorheriger Online-Start muss Config und Personenliste im Browser-Cache hinterlegt haben."
    steps:
      - "Kasse verliert Verbindung oder wird offline aus der PWA-Shell geoeffnet."
      - "Person antippen und normales Getraenk buchen."
      - "Sync-Feld zeigt 'Nicht synchronisiert' plus Anzahl der offline vorgemerkten Buchungen."
      - "Bei Wiederverbindung oder manuellem Refresh sendet die Queue alle Eintraege chronologisch an /api/add-drink."
    expected_result:
      - "Personensumme und Strichliste werden lokal sofort optimistisch erhoeht."
      - "Server bekommt jede Buchung mit client_operation_id und verarbeitet doppelte Nachsendungen idempotent."
      - "Nach erfolgreicher Synchronisierung verschwindet die Offline-Anzahl aus dem Sync-Feld."
  kostenwarnung_und_zahlungserinnerung:
    steps:
      - "Adminbereich oeffnen."
      - "Darstellung -> Kostenwarnung & Zahlungserinnerung aufklappen."
      - "Grenzwerte, Aktivierung und Sichtbarkeit fuer Standardansicht/Personen-Popup setzen."
      - "Darstellung speichern."
      - "Kassenansicht oeffnen und Person mit entsprechend hohem offenem Betrag ansehen."
    expected_result:
      - "Personenkarte zeigt Warnung oder Zahlungserinnerung nur, wenn Standardansicht aktiviert ist."
      - "Personen-Popup zeigt die passende Meldung nur, wenn Popup-Anzeige aktiviert ist."
      - "Buchungen bleiben weiterhin moeglich; die Meldung blockiert keine Aktion."
  nachricht_an_mitglieder:
    steps:
      - "Adminbereich -> Einstellungen -> Nachrichten an Mitglieder oeffnen."
      - "Sichtbarkeit fuer Standardansicht und/oder Personen-Popup setzen und speichern."
      - "Titel und Nachricht schreiben."
      - "Einzelne Mitglieder oder alle aktiven Mitglieder auswaehlen."
      - "'Nachricht anzeigen' druecken."
      - "Mitglied oeffnet das Personen-Popup und bestaetigt die Nachricht dort mit 'Verstanden'."
    expected_result:
      - "Nachricht erscheint nur bei ausgewaehlten aktiven Mitgliedern."
      - "Nachricht erscheint nur in den aktivierten Flaechen: Standardansicht und/oder Personen-Popup."
      - "Nach Bestaetigung wird sie fuer diese Person nicht mehr angezeigt."
      - "Admin sieht bei aktiven Nachrichten, wie viele Empfaenger bereits bestaetigt haben."
      - "Alte oder archivierte Nachrichten werden nicht direkt unter der Nachrichtserstellung gelistet, bleiben aber im Verlauf der Datenbank sichtbar."
  runde_zahlen:
    steps:
      - "Person antippen."
      - "Im Popup Bereich 'Runde zahlen' den Button '+ 1 Runde fuer alle' antippen."
      - "Bestaetigungsdialog lesen und bestaetigen."
      - "Popup aktualisiert sich; '1 Runde' steht als offener Posten."
    expected_result:
      - "Kein Admin muss genehmigen."
      - "Runde bleibt auf der Rechnung der zahlenden Person."
      - "Beim naechsten Kassensturz werden automatisch passende Getraenke aus der aktuellen Strichliste abgezogen."
  runde_irrtuemlich_eingetragen:
    steps:
      - "Person antippen."
      - "Loeschanfrage oeffnen."
      - "Bei '1 Runde' die zu entfernende Menge waehlen."
      - "'Anfragen' antippen."
      - "Admin entscheidet die Loeschanfrage im Adminmodus."
    expected_result:
      - "Bis zur Admin-Entscheidung bleibt die Menge sichtbar, ist aber fuer automatische Rundenabzuege reserviert."
  kassensturz_mit_runden:
    steps:
      - "Adminmodus aktivieren."
      - "'Kassensturz' antippen."
      - "Popup pruefen: bestaetigte Runden, automatische Abzuege, Brutto-/Netto-Summe und EK/VK-Ergebnis."
      - "Wenn die Vorschau passt, 'Kassensturz durchfuehren' antippen."
    expected_result:
      - "Bestaetigte Runden werden automatisch abgezogen."
      - "Verbleibende aktuelle Strichliste wird geschlossen."
      - "Offene Rechnungen bleiben bestehen."
      - "Rundenabzug wird in round_events und Verlauf nachvollziehbar protokolliert."
  barzahlung:
    steps:
      - "Adminmodus aktivieren."
      - "Person antippen."
      - "Im Adminbereich 'Bar bezahlen' waehlen."
      - "Zahlungsdialog mit Posten und Summe pruefen."
      - "Barzahlung bestaetigen."
    expected_result:
      - "PAID_CASH wird geschrieben."
      - "Alle offenen Posten der Person werden auf quantity=0 gesetzt."
  mobile_kassa_barzahlung:
    steps:
      - "Bekannte URL /kassa am Handy im Hochformat oeffnen."
      - "Kassa mit Admin-PIN entsperren."
      - "Person in der kompakten Name/Betrag-Liste suchen und antippen."
      - "Konsumierte Getraenke in der Detailansicht pruefen."
      - "Bei falscher Person 'Abbrechen' antippen."
      - "Wenn alles passt, 'Bezahlt' antippen."
    expected_result:
      - "PAID_CASH wird geschrieben."
      - "Alle zum geprueften Stand offenen Posten der Person werden auf quantity=0 gesetzt."
      - "Wenn ein anderes Geraet seit dem Oeffnen der Detailansicht noch gebucht hat, wird nicht bezahlt; die Seite zeigt den aktualisierten Stand zur erneuten Pruefung."
      - "Die Standard-Kassenansicht bleibt unveraendert und verlinkt die mobile Kassa nicht."
  mitglieder_sumup_selbstzahlung:
    steps:
      - "iPad-PWA oder URL / oeffnen; nicht /kassa."
      - "Name in der normalen Listenansicht antippen und offene Posten pruefen."
      - "Unten im Personenfenster 'Mit SumUp zahlen' antippen und Zahlung bestaetigen."
      - "Karte/Smartphone am SumUp Solo verwenden."
      - "Bei Verbindungsabbruch Seite offen lassen oder erneut die Liste bzw. /self-pay-Testseite oeffnen; die gespeicherte client_payment_id wird weiter geprueft."
    expected_result:
      - "PAID_SUMUP wird genau einmal geschrieben."
      - "Retry/Doppeltippen mit derselben client_payment_id startet keine zweite SumUp-Zahlung."
      - "Bei created/sent_to_reader/pending bleibt die Person gegen parallele Buchungen/Zahlungen gesperrt."
      - "Bei failed/cancelled/timeout/unknown/expired zeigt die Seite den Status; Admin prueft im Zweifel SumUp-Status und Verlauf."
  manuelle_synchronisierung:
    steps:
      - "Auf der Seite ganz nach oben scrollen."
      - "Noch weiter nach unten ziehen, bis der Sync-Hinweis erscheint."
      - "Loslassen."
    expected_result:
      - "Seite synchronisiert sofort."
      - "Routine-Sync schreibt keinen Verlaufseintrag."
      - "Manuelle Sync-Logs enthalten Geraeteinformationen."

backup_and_recovery:
  implemented: true
  files:
    script: "app/backup_database.py"
    scheduler: "compose.yaml"
  scheduler:
    service: "drink-pos-backup"
    hardcoded_time: "jeden Freitag um 03:00 Uhr"
    timezone: "Europe/Zurich"
    behavior:
      - "Der Backup-Container prueft alle 30 Sekunden Wochentag und Uhrzeit."
      - "Wenn Freitag 03:00 erreicht ist, wird app/backup_database.py ausgefuehrt."
      - "Nach einem erfolgreichen Start wartet der Scheduler ca. 61 Minuten, damit derselbe Zeitpunkt nicht mehrfach exportiert wird."
  output:
    directory: "./data/backups"
    filename_pattern: "drink_pos_backup_YYYY-MM-DD_HHMMSS.csv"
    format: "CSV mit Semikolon-Trennung und UTF-8-BOM fuer Excel"
    columns:
      - "backup_created_at"
      - "source_db"
      - "section"
      - "table_name"
      - "row_id"
      - "data_json"
  exported_content:
    metadata:
      - "App-Name"
      - "Umgebung development/production"
      - "Quell-Datenbankpfad"
      - "Datenbank-Dateigroesse"
      - "Backup-Zeitpunkt"
    schema: "sqlite_master Eintraege fuer Tabellen, Indizes, Views und Trigger"
    summaries: "Zeilenanzahl und Spaltenliste pro wichtiger Tabelle"
    tables:
      - "settings"
      - "people"
      - "items"
      - "order_lines"
      - "change_requests"
      - "round_requests"
      - "member_messages"
      - "member_message_recipients"
      - "transactions"
      - "client_operations"
      - "self_payment_sessions"
      - "transaction_items"
      - "round_events"
  consistency:
    method: "SQLite Online-Backup API erstellt zuerst eine temporaere Snapshot-Datenbank."
    reason: "Der CSV-Export bleibt auch bei laufender App und WAL-Dateien konsistent."
  restore_note: >-
    Das CSV ist als Worst-Case-Rettungsformat gedacht. Die Zeilen liegen in data_json
    als strukturierte Originaldaten. Ein automatischer Restore/Import ist noch nicht implementiert.
