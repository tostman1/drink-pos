project:
  name: "Drink POS / Getränkeliste"
  language: "de"
  currency: "EUR"
  current_state: "guter Arbeitsstand für lokalen Vereinsbetrieb"
  app_type: "lokale touch-freundliche PWA/Web-App mit FastAPI Backend und SQLite"
  primary_goal: >-
    Digitale Getränkeliste / Strichliste für Vereins- oder Veranstaltungsbetrieb.
    Benutzer buchen Getraenke und bestaetigen bezahlte Runden; Admins verwalten Personen,
    Artikel, Preise, Korrekturen, Zahlungen, Kassensturz, Statistik, Verlauf, Berichte und Exporte.
  non_goal: >-
    Kein öffentliches Internetprodukt, keine mandantenfähige SaaS-App, keine vollwertige Offline-Kasse.
    Nur normale Getränkebuchungen werden lokal vorgemerkt und später synchronisiert.
  core_principles:
    - "Accounting/Audit hat Vorrang vor optischer Einfachheit."
    - "Transaktionsverlauf bleibt unveränderlich; Korrekturen werden als neue Transaktionen geschrieben."
    - "Offene Posten behalten Snapshots von VK, EK, Name, Kurzlabel und Admin-only-Status vom Konsumzeitpunkt."
    - "Inaktive/archivierte Artikel bleiben in offenen Rechnungen sichtbar und zahlbar."
    - "Personen werden archiviert/deaktiviert, nicht hart aus historischen Daten gelöscht."
    - "'1 Runde' ist ein Systemartikel, kein normaler Getränkeartikel."
    - "Aktuelle Strichliste und offene Gesamtrechnung sind getrennte Konzepte."
    - "Kassensturz beendet nur die aktuelle Strichliste/event_open, nicht offene Schulden."
    - "Offline-Schreiblogik ist bewusst auf normale Getränkebuchungen begrenzt; Runden, Korrekturen, Zahlungen und Adminaktionen bleiben online-only."
    - "Mitglieder-Selbstzahlung ueber SumUp Solo ist in der normalen Listenansicht integriert; /self-pay bleibt Test-/Fallbackseite und Mitglieder brauchen keinen Zugriff auf /kassa."

source_layout:
  backend:
    file: "app/main.py"
    framework: "FastAPI"
    style: "Single-File-App ohne separates ORM"
  frontend_cashier:
    file: "app/index.html"
    style: "Vanilla HTML/CSS/JS, keine Build-Pipeline"
    purpose: "Touch-Kassenansicht für Benutzer und Adminmodus"
  frontend_admin:
    file: "app/admin.html"
    style: "Vanilla HTML/CSS/JS, keine Build-Pipeline"
    purpose: "Organisation, Einstellungen, Verlauf, Berichte, CSV"
  frontend_mobile_kassa:
    file: "app/kassa.html"
    style: "Vanilla HTML/CSS/JS, keine Build-Pipeline"
    purpose: "Versteckte Handy-Hochformat-Seite fuer schnelles Kassieren mit Konfliktschutz"
  frontend_self_pay:
    file: "app/self-pay.html"
    style: "Vanilla HTML/CSS/JS, keine Build-Pipeline"
    purpose: "Mitglieder-Selbstzahlung ueber SumUp Solo ohne Zugriff auf /kassa"
  pwa_files:
    - "app/manifest.webmanifest"
    - "app/kassa.webmanifest"
    - "app/self-pay.webmanifest"
    - "app/service-worker.js"
    - "app/icon.svg"
    - "app/icon-192.png"
    - "app/icon-512.png"
  deployment:
    file: "compose.yaml"
    helper_files:
      - "requirements.txt"
      - ".env.example"
      - "README.md"
    server: "uvicorn main:app --host 0.0.0.0 --port 8000"
    exposed_port: "8088:8000"
    volumes:
      - "./app:/app"
      - "./data:/app/data"
  database:
    engine: "SQLite"
    mode: "WAL"
    access: "sqlite3 direkt in main.py"
    connection_defaults:
      timeout_seconds: 15
      busy_timeout_ms: 15000
      foreign_keys_per_connection: true
      closes_per_request_context: true

runtime_environment:
  environment_variables:
    DRINK_POS_ENV:
      default: "development"
      allowed_values:
        - "development"
        - "production"
        - "prod"
      effects:
        development:
          database_default: "/app/data/drink_pos_dev.db"
          debug_test_data_endpoint: "aktiv"
          test_data_button: "sichtbar"
          admin_devmode_warning: "sichtbar"
          sync_connection_logging: "aktiv"
        production:
          database_default: "/app/data/drink_pos.db"
          debug_test_data_endpoint: "deaktiviert"
          test_data_button: "nicht sichtbar"
          admin_devmode_warning: "nicht sichtbar"
          sync_connection_logging: "deaktiviert"
    DRINK_POS_DB:
      default: "leer / nicht setzen"
      behavior: >-
        Wenn gesetzt, überschreibt dieser Pfad die env-basierte automatische DB-Auswahl.
        Wenn nicht gesetzt, wird abhängig von DRINK_POS_ENV automatisch drink_pos_dev.db oder drink_pos.db verwendet.
    DRINK_POS_PIN:
      default: "1234"
      behavior: "Wird beim ersten DB-Start als settings.admin_pin übernommen; ersetzt außerdem eine bestehende Default-PIN 1234, wenn DRINK_POS_PIN explizit gesetzt ist."
      note: "Diese YAML-Datei ist Dokumentation und wird von der App nicht als Konfiguration geladen."
    DRINK_POS_AGENT_TOKEN:
      default: "leer"
      behavior: "Aktiviert die schmale Agenten-REST-API, wenn gesetzt."
    PAYMENT_PROVIDER:
      default: "leer"
      behavior: "Mit Wert sumup wird SumUp Solo Self-Checkout aktiviert."
    SUMUP_API_BASE:
      default: "https://api.sumup.com"
      behavior: "Basis-URL der SumUp Cloud API."
    SUMUP_API_KEY:
      default: "leer"
      behavior: "Serverseitiger SumUp API Key; niemals im Frontend verwenden."
    SUMUP_MERCHANT_CODE:
      default: "leer"
      behavior: "SumUp Merchant Code."
    SUMUP_READER_ID:
      default: "leer"
      behavior: "SumUp Solo Reader ID."
    SUMUP_AFFILIATE_KEY:
      default: "leer"
      behavior: "Optionaler Affiliate Key fuer SumUp Cloud API Checkout-Metadaten."
    SUMUP_AFFILIATE_APP_ID:
      default: "leer"
      behavior: "Optionale App ID fuer SumUp Affiliate-Metadaten."
    SUMUP_CURRENCY:
      default: "EUR"
      behavior: "Waehrung fuer SumUp-Zahlungen."
    SUMUP_TIMEOUT_SECONDS:
      default: "120"
      behavior: "Wartezeit fuer SumUp-Zahlungen; Session-Sperre bleibt mindestens 300 Sekunden bestehen."
  production_pin_guard: "Admin-Login und PIN-pflichtige Admin-API-Aktionen sind in production gesperrt, solange die konfigurierte PIN noch 1234 ist."
  recommended_operation:
    development: "DRINK_POS_ENV=development für Testdatenbank und Debug-Testdaten."
    production: "DRINK_POS_ENV=production für echten Vereinsbetrieb."
  reset_database:
    development_files:
      - "./data/drink_pos_dev.db"
      - "./data/drink_pos_dev.db-wal"
      - "./data/drink_pos_dev.db-shm"
    production_files:
      - "./data/drink_pos.db"
      - "./data/drink_pos.db-wal"
      - "./data/drink_pos.db-shm"
    steps:
      - "docker compose down"
      - "passende DB-Dateien löschen"
      - "docker compose up -d"

pwa_and_app_feeling:
  implemented: true
  installability:
    android: "Über Browser/Chrome als PWA installierbar."
    ios_ipados: "Über Safari: Teilen -> Zum Home-Bildschirm; standalone Darstellung über Manifest/Meta-Tags."
  required_for_reliable_pwa: "HTTPS oder localhost; Service Worker benötigen sicheren Kontext."
  manifest:
    display: "standalone"
    icons:
      - "icon.svg"
      - "icon-192.png"
      - "icon-512.png"
  service_worker:
    file: "app/service-worker.js"
    role: "Shell-Caching statischer Dateien"
    cache_version_rule: "Nach UI-Änderungen CACHE_NAME erhöhen."
    current_expected_cache_name: "drink-pos-shell-v88"
  offline_policy:
    read_shell_offline: "statische App-Shell kann aus Cache kommen"
    write_offline: "nur normale Getraenkebuchungen"
    reason: "Normale Getraenkebuchungen sind additiv und koennen lokal vorgemerkt werden; Kassensturz, Zahlung, Runden, Admin-Aktionen und SumUp-Zahlungsstarts bleiben online-only. Self-Pay nutzt bei Abbruch eine serverseitige Statusabfrage statt Offline-Buchung."

sync_and_connectivity:
  concept: >-
    Die App hat eine sichtbare Sync-/Verbindungsanzeige unten rechts. Sie ersetzt störende Toasts
    für Hintergrundsynchronisation und zeigt Status plus letzten Sync an.
  endpoints:
    status: "GET /api/sync-status"
    client_event: "POST /api/client-event"
  behavior:
    heartbeat: "leichter Status-Check, kein schweres Dauerpolling"
    after_user_action: "nach Getränk/Korrektur/Zahlung/Settings etc. wird aktiv neu geladen"
    reconnect: "bei Wiederverbindung wird synchronisiert"
    no_auto_popup: "automatische Hintergrundsyncs zeigen kein Toast 'Daten neu synchronisiert'"
    indicator_position: "fixed bottom right"
    last_sync_format: "dd.mm.yy, HH:MM oder aehnlich lokales Format"
    tablet_recovery:
      trigger: "mehrere fehlgeschlagene Sync-Checks, obwohl navigator.onLine weiterhin true meldet"
      steps:
        - "Sync-Feld zeigt 'Nicht synchronisiert' und ab Stufe 3 'Auto-Reconnect aktiv'."
        - "Client prueft /api/sync-status mit Cache-Control:no-cache und kurzer Timeout-Grenze."
        - "Falls vorhanden, wird die Service-Worker-Registration aktualisiert."
        - "Bei Erfolg werden Config und Daten neu geladen."
        - "Falls der haengende Zustand laenger als 45 Sekunden besteht, laedt die Seite sich einmal kontrolliert neu."
      safeguards:
        - "Kein Auto-Reload bei geoeffnetem Personen-/Aktionsdialog in der Kasse."
        - "Kein Auto-Reload waehrend Eingabefelder in der Adminseite aktiv sind."
        - "Reload-Cooldown vier Minuten gegen Schleifen."
    offline_drink_queue:
      scope: "nur normale Benutzer-Getraenkebuchungen aus der Kassenansicht"
      storage: "localStorage Queue plus letzter erfolgreicher Config-/Personen-Cache"
      sync: "chronologisch nach /api/add-drink senden, sobald Verbindung wieder da ist"
      idempotency: "client_operation_id verhindert Doppelbuchungen bei verlorenen Antworten"
      ui: "Sync-Feld zeigt wartende Offline-Buchungen; Personensumme und Strichliste werden lokal optimistisch erhoeht"
      excluded:
        - "Rundenzahlung"
        - "Barzahlung"
        - "Kassensturz"
        - "Loeschanfragen"
        - "Admin-Korrekturen und Einstellungen"
  settings:
    show_sync_status:
      type: "boolean as TEXT '1'/'0'"
      default: "1"
      purpose: "Sync-/Verbindungsanzeige unten rechts anzeigen/verstecken"
    sync_status_size_percent:
      type: "integer as TEXT"
      default: "100"
      range: "70..180"
      purpose: "Größe der Sync-Anzeige"
  logging:
    events:
      - "CONNECTION_LOST / Verbindung verloren"
      - "CONNECTION_RESTORED / Verbindung aufgenommen"
      - "SYNC_COMPLETED / Synchronisiert"
    production: "keine Verlaufseinträge; Server bestätigt Events, schreibt aber nicht in transactions"
    development: "Ereignisse werden in transactions geloggt"
    anti_spam: "nur bei Statuswechsel oder echter Synchronisation; nicht bei jedem Heartbeat"
  webhook_assessment:
    use_webhooks: false
    reason: "Webhooks sind Server-zu-Server; für Browser/iPad besser Heartbeat, Fetch, optional später SSE/WebSocket."
    future_best_live_sync: "Server-Sent Events oder WebSocket, wenn mehrere Geräte sofort live synchron sein sollen."

business_domain:
  people:
    description: "Mitglieder/Kunden, denen Getränke und Posten zugeordnet werden."
    identity: "id"
    display_name: "name als kompatibler Vollname, plus first_name/last_name"
    deletion_policy: "archivieren/deaktivieren statt hart löschen"
    sorting: "last_name, first_name, fallback name; Umlaute normalisiert"
  member_messages:
    description: "Benutzerdefinierte Admin-Nachrichten an ausgewaehlte aktive Mitglieder."
    display: "Je nach Einstellung zeigt die Personenkarte einen reinen Nachrichten-Badge und/oder das Personen-Popup Titel, Text und Verstanden-Button."
    acknowledgement: "Bestaetigung wird pro Person gespeichert; danach wird diese Nachricht fuer diese Person nicht mehr angezeigt."
    admin_management: "Admin legt Nachricht mit Empfaengerauswahl an und sieht in den Einstellungen nur aktive Nachrichten zur Verwaltung; alte/archivierte Nachrichten erscheinen dort nicht als Verlauf."
    audit_history: "Anlegen, Archivieren und Bestaetigen werden als Verlaufseintraege in transactions gespeichert."
  items:
    description: "Getränke/Artikel plus Systemartikel '1 Runde'."
    normal_item_fields:
      - "name"
      - "short_label"
      - "price_eur / VK"
      - "purchase_price_eur / EK"
      - "active"
      - "admin_only"
      - "sort_order"
    system_item:
      name: "1 Runde"
      short_label: "Runde"
      admin_only: true
      purchase_price_eur: 0
      managed_in_settings: true
      hidden_from_normal_item_admin: true
      user_can_request: true
      user_can_add_directly: false
      user_can_delete_request: true
  consumption:
    normal_user: "Darf aktive, nicht-admin-only Artikel buchen."
    admin: "Darf normale und admin-only Artikel buchen/korrigieren."
    effect:
      - "order_lines quantity wird erhöht oder zusammengeführt"
      - "transactions CONSUME wird geschrieben"
      - "transaction_items Detailzeile wird geschrieben"
  open_bill:
    definition: "Summe aller order_lines mit quantity > 0, unabhängig von event_open."
    payment: "Barzahlung schreibt PAID_CASH; SumUp-Selbstzahlung schreibt PAID_SUMUP. Beide setzen offene order_lines der Person auf quantity=0."
    mobile_kassa: "Versteckte Seite /kassa fuer Handy-Hochformat: Name/Betrag-Liste, Detail mit Getraenken, PIN-geschuetztes Bezahlen mit Revisionspruefung gegen parallele Buchungen."
    member_self_pay: "SumUp-Zahlung ist im Personenfenster der Listenansicht integriert; /self-pay bleibt Test-/Fallbackseite. iPad spricht nur mit dem Server; der Server startet die Zahlung per SumUp Cloud API."
  event_tally:
    definition: "Aktuelle Veranstaltung seit letztem Kassensturz."
    field: "order_lines.event_open"
    new_consumption: "event_open=1"
    cashup: "setzt event_open=0 für aktuelle offene Strichlisten-Zeilen, lässt offene Beträge bestehen"
  delete_requests:
    description: "Normale Benutzer können Löschung offener nicht-admin-only Posten beantragen."
    current_ui: >-
      Löschanfrage ist klein/einklappbar. Beim Öffnen werden löschbare Getränke angezeigt.
      Mengen per +/- wählen; Button 'Anfragen' wird erst aktiv, wenn mindestens eine Löschung gewählt ist.
      Menü kann jederzeit geschlossen werden ohne Änderung.
    setting:
      key: "enable_delete_requests"
      default: "1"
      server_enforced: true
      purpose: "Löschanfragen komplett aktivieren/deaktivieren"
  round_requests:
    description: "Historischer Name im Code; fachlich heute: Benutzer bestaetigen, dass sie eine Runde zahlen."
    decision: "Keine Admin-Genehmigung mehr noetig."
    approved_effect: "Systemartikel '1 Runde' wird sofort als offener Posten zur Person gebucht und in round_requests als APPROVED protokolliert."
  round_deduction:
    description: "Automatischer Rundenabzug beim Kassensturz; die alte manuelle Adminfunktion bleibt als API vorhanden, ist in der Kasse aber ausgeblendet."
    preview_endpoint: "POST /api/deduct-round-preview"
    execute_endpoint: "POST /api/deduct-round"
    precondition: "Automatik ignoriert Mengen, die bereits in offenen Loeschanfragen gebunden sind."
    rules:
      - "pro aktiver Person maximal ein Getränk"
      - "günstigstes normales Getränk der aktuellen Strichliste wird entfernt"
      - "nur event_open=1 und admin_only_snapshot=0"
      - "alte offene Getränke früherer Veranstaltungen bleiben unberührt"
      - "Gewinn für Runde = Rundenpreis - Summe EK der abgezogenen Getränke"
  cashup:
    description: "Abschluss der aktuellen Veranstaltung/Strichliste mit automatischem Rundenabzug."
    preview: "zeigt Brutto-Strichliste, bestaetigte Runden, automatische Abzuege, Netto-Strichliste, EK/VK-Ergebnis"
    execute: "zieht bestaetigte Runden ab, schreibt ROUND_DEDUCTED/round_events, setzt event_open=0, schreibt CASHUP"
  payment:
    description: "Zahlungsabschluss fuer offene Rechnungen: Barzahlung intern als PAID_CASH, Mitglieder-Selbstzahlung per SumUp als PAID_SUMUP."
    ui: "eigener GUI-Dialog, kein Browser-confirm; gruppierte Posten mit Menge, Preis, Gesamt."
    mobile_kassa_ui: "/kassa ist nicht in der Standardansicht verlinkt; nach PIN-Entsperrung zeigt sie nur offene Personen, Betrag und im Detail die konsumierten Getraenke."
    conflict_protection: "POST /api/kassa/pay verlangt expected_revision aus /api/kassa/person/{person_id}; wenn inzwischen andere Geraete gebucht haben, antwortet der Server mit 409 und aktuellem Stand."
    self_pay_ui: "Primaerer Bedienweg ist die normale Listenansicht: Name antippen, unten im Personenfenster Kartenzahlung starten. /self-pay bleibt als separate Test-/Fallbackseite."
    self_pay_double_booking_protection: "POST /api/self-pay/pay verlangt client_payment_id und expected_revision; client_payment_id ist in self_payment_sessions eindeutig, Wiederholungen liefern den bestehenden Status statt einen zweiten SumUp-Start."
    self_pay_connection_recovery: "GET /api/self-pay/payment/{client_payment_id} liefert created/sent_to_reader/pending/paid/failed/cancelled/timeout/unknown/expired, damit das iPad nach Verbindungsabbruch denselben Vorgang wiederaufnimmt."

number_and_currency_formatting:
  visible_separator: ","
  accepted_input_separators:
    - ","
    - "."
  behavior:
    - "Preisfelder akzeptieren 2,50 und 2.50."
    - "Punkt-Eingaben werden im GUI zu Komma normalisiert."
    - "Serverseitige Parser akzeptieren float/int sowie Strings mit Komma oder Punkt."
    - "Geldanzeigen in GUI, Verlauf, Berichten und CSV sollen Komma nutzen."
  internal_storage:
    sqlite: "REAL für Geldwerte in Daten-/Snapshot-Tabellen"
    settings: "TEXT, aber API konvertiert"

settings:
  storage_table: "settings"
  storage_type: "key TEXT primary key, value TEXT, updated_at TEXT"
  conversion: "API/Frontend konvertieren zu bool/int/float/string"
  keys:
    admin_pin:
      type: "string"
      default_from_env: "DRINK_POS_PIN"
      env_override_rule: "DRINK_POS_PIN ersetzt nur fehlende PINs oder die unsichere Default-PIN 1234; bewusst gesetzte andere PINs in der DB bleiben erhalten."
      security: "Plaintext, bewusst einfach für lokales vertrauenswürdiges Netzwerk"
    currency:
      type: "string"
      default: "EUR"
      currently_fixed: true
    app_name:
      type: "string"
      default: "Drink POS"
      purpose: "Header, Titel, PWA/App-Name"
    round_item_price_eur:
      type: "decimal string"
      default: "10.00"
      input_format: "Komma oder Punkt akzeptiert, GUI zeigt Komma"
    show_total_on_overview:
      type: "boolean"
      default: true
      purpose: "Gesamtpreis in Standardübersicht anzeigen; Admin sieht Gesamtpreis immer"
    show_person_popup_total:
      type: "boolean"
      default: true
      purpose: "Offene Gesamtsumme im Personen-Popup anzeigen/verstecken"
    show_summary_label_on_overview:
      type: "boolean"
      default: true
      purpose: "Label vor Kurzauflistung anzeigen"
    overview_summary_label_text:
      type: "string"
      default: "Gesamt:"
      purpose: "Text vor Kurzauflistung"
    overview_name_size_px:
