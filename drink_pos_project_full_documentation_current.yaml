security:
  intended_network: "vertrauenswürdiges lokales Netzwerk"
  public_exposure: "nicht empfohlen"
  admin_pin:
    storage: "settings.admin_pin Plaintext"
    reason: "bewusst einfach"
    risk: "Jeder DB-Zugriff sieht PIN"
  implemented_hardening:
    - "/api/transactions ist PIN-pflichtig und liefert Verlauf nicht mehr öffentlich aus."
    - "/api/admin-login hat ein einfaches In-Memory Rate Limit pro Client."
    - "/health und /api/config redigieren den DB-Pfad in production."
    - "SQLite Foreign Keys und busy_timeout werden in get_conn pro Verbindung gesetzt."
    - "Admin-Login und direkte PIN-pflichtige Admin-API-Calls werden in production blockiert, solange die Standard-PIN 1234 aktiv ist."
    - "SumUp-Selbstzahlung nutzt eindeutige client_payment_id, self_payment_sessions und Personensperren, damit Retry/Doppeltippen keine zweite Zahlung startet."
  recommended_if_public:
    - "nicht Port 8088 direkt ins Internet freigeben"
    - "VPN oder Reverse Proxy mit HTTPS und zusätzlicher Auth"
    - "regelmäßige SQLite-Backups"
    - "admin_pin später mit Argon2/bcrypt hashen"
    - "kurzlebige Admin-Session-Tokens statt PIN in jedem Request"
    - "später benannte Admins statt gemeinsamer PIN"

testing_checklist:
  commands:
    python: "python3 -m py_compile app/main.py"
    backend_unittest: "py -m unittest discover -s tests"
    javascript_index: "node --check extracted-index-script.js oder entsprechender Extrakt aus index.html"
    javascript_admin: "node --check extracted-admin-script.js oder entsprechender Extrakt aus admin.html"
  backend_scenarios:
    - "Automatisierte Tests in tests/test_backend.py decken Foreign Keys/busy_timeout, Buchung, Zahlung, Kassa-Revisionskonflikt, SumUp-Self-Pay-Idempotenz, Kassensturz, Runde, Offline-Idempotenz und /api/transactions-PIN ab."
    - "Neue development DB starten; /api/config und /api/people prüfen."
    - "Production DB separat prüfen; keine Testdaten/Synclogs."
    - "Konsum buchen; order_lines, transactions, transaction_items prüfen."
    - "Komma- und Punktpreise über API und GUI testen."
    - "Kurzlabel/Preis/EK ändern; alte offene Posten müssen Snapshots behalten."
    - "Artikel deaktivieren/archivieren; offene Posten bleiben zahlbar."
    - "Löschanfrage aktiv/deaktiviert testen, inkl. serverseitiger Sperre."
    - "Runde zahlen: /api/round-request bucht sofort APPROVED und offenen Systemartikel."
    - "Kassensturz: event_open=0, offene Beträge bleiben."
    - "Runde abziehen: nur aktuelle event_open normale Artikel."
    - "Barzahlung: alle offenen Posten quantity=0, PAID_CASH geschrieben."
    - "SumUp-Selbstzahlung: gleicher client_payment_id-Retry startet keine zweite SumUp-Zahlung; PAID_SUMUP wird nur einmal geschrieben."
    - "Offline-Getraenkebuchung mit client_operation_id zweimal senden; Menge darf nur einmal steigen."
    - "client_operations muss transaction_id der ersten erfolgreichen Buchung speichern."
    - "/api/transactions ohne PIN muss 403 liefern; mit PIN 200."
    - "History types Mehrfachfilter inkl. alle abwählen."
  frontend_scenarios:
    - "PWA installieren auf iPad/iOS und Android."
    - "Sync-Anzeige offline/online simulieren."
    - "Kasse offline starten mit Cache; normale Getraenkebuchung vormerken und im Sync-Feld zaehlen."
    - "Wieder online: Offline-Queue wird chronologisch gesendet und verschwindet aus dem Sync-Feld."
    - "Runde, Zahlung, Kassensturz, Loeschanfrage und Admin-Aktionen bleiben offline blockiert."
    - "Auto-Reconnect bei haengendem Sync pruefen; kein Reload bei offenem Personen-/Aktionsdialog."
    - "Automatischer Sync darf keinen störenden Toast zeigen."
    - "Personen-Popup: Getränke, Fertig, Runde, Löschmenü Reihenfolge."
    - "Klick außerhalb Popup schließt ohne Aktion."
    - "Designsettings Live-Vorschau und echte Ansicht vergleichen."
    - "Popup-Gesamtsumme per Setting aus/ein."

implementation_guidance_for_future_ai:
  always_do:
    - "main.py, index.html und admin.html gemeinsam betrachten, weil API und UI eng gekoppelt sind."
    - "Bei Datenmodelländerungen Startup-Migrationen ergänzen."
    - "Bei Offline-Buchungen client_operation_id/idempotente Verarbeitung beibehalten."
    - "Snapshots in order_lines und transaction_items respektieren."
    - "Systemartikel '1 Runde' separat behandeln."
    - "Bei UI-Änderungen service-worker CACHE_NAME erhöhen."
    - "Python- und JavaScript-Syntaxchecks ausführen."
    - "Komma als sichtbaren Dezimalseparator beibehalten."
  avoid:
    - "Nicht aktuelle item.price_eur für alte offene Posten verwenden; immer order_lines.unit_price_eur."
    - "Nicht Name/short_label als Identität verwenden; item_id ist Identität."
    - "event_open nicht mit bezahlt/offen verwechseln."
    - "Keine weitere Offline-Schreiblogik ohne Konfliktkonzept; aktuell nur normale Getraenkebuchungen."
    - "Runden-EK nicht über Systemartikel berechnen."
    - "Keine zweite Fake-Popup-Struktur bauen, wenn eine gemeinsame Renderfunktion möglich ist."

