    drink_celebration_sound_enabled:
      type: "boolean"
      default: true
      purpose: "Feierlichen Web-Audio-Ton zusammen mit dem Konfetti abspielen"
    cost_warning_enabled:
      type: "boolean"
      default: true
      purpose: "Kostenwarnung in Personenkarte und Personen-Popup anzeigen"
    cost_warning_threshold_eur:
      type: "decimal string"
      default: "30.00"
      purpose: "Offener Betrag, ab dem die Kostenwarnung erscheint"
    payment_reminder_enabled:
      type: "boolean"
      default: true
      purpose: "Stärkere Zahlungserinnerung in Personenkarte und Personen-Popup anzeigen"
    payment_reminder_threshold_eur:
      type: "decimal string"
      default: "50.00"
      purpose: "Offener Betrag, ab dem die Zahlungserinnerung die Kostenwarnung ersetzt"
    cost_notice_show_on_overview:
      type: "boolean"
      default: true
      purpose: "Kostenwarnung/Zahlungserinnerung in der Standardansicht anzeigen"
    cost_notice_show_in_popup:
      type: "boolean"
      default: true
      purpose: "Kostenwarnung/Zahlungserinnerung im Personen-Popup anzeigen"
    member_messages_show_on_overview:
      type: "boolean"
      default: true
      purpose: "Mitgliedernachrichten in der Standardansicht als kompakte Hinweiszeile ohne Bestaetigungsaktion anzeigen"
    member_messages_show_in_popup:
      type: "boolean"
      default: true
      purpose: "Mitgliedernachrichten im Personen-Popup anzeigen"
    payment_provider:
      type: "string"
      default: ""
      env_override: "PAYMENT_PROVIDER"
      purpose: "Mit Wert sumup wird Mitglieder-Selbstzahlung in Listenansicht und /self-pay-Testseite aktiviert"
    sumup_api_base:
      type: "string"
      default: "https://api.sumup.com"
      env_override: "SUMUP_API_BASE"
      purpose: "Basis-URL der SumUp Cloud API"
    sumup_api_key:
      type: "string"
      default: ""
      env_override: "SUMUP_API_KEY"
      purpose: "Serverseitiger SumUp API Key"
    sumup_merchant_code:
      type: "string"
      default: ""
      env_override: "SUMUP_MERCHANT_CODE"
      purpose: "SumUp Merchant Code"
    sumup_reader_id:
      type: "string"
      default: ""
      env_override: "SUMUP_READER_ID"
      purpose: "SumUp Solo Reader ID"
    sumup_affiliate_key:
      type: "string"
      default: ""
      env_override: "SUMUP_AFFILIATE_KEY"
      purpose: "Optionaler SumUp Affiliate Key"
    sumup_affiliate_app_id:
      type: "string"
      default: ""
      env_override: "SUMUP_AFFILIATE_APP_ID"
      purpose: "Optionale SumUp Affiliate App ID"
    sumup_currency:
      type: "string"
      default: "EUR"
      env_override: "SUMUP_CURRENCY"
      purpose: "Waehrung fuer SumUp-Zahlungen"
    sumup_timeout_seconds:
      type: "integer/string"
      default: "120"
      env_override: "SUMUP_TIMEOUT_SECONDS"
      purpose: "Terminal-Wartezeit fuer SumUp-Zahlungen"
    app_background_color:
      type: "CSS color"
      default: "#f3f4f6"
      purpose: "Hintergrundfarbe der App/Kassenansicht"
    person_card_background_color:
      type: "CSS color"
      default: "#ffffff"
      purpose: "Hintergrundfarbe der Personenkarte"
    person_card_border_color:
      type: "CSS color"
      default: "#bfdbfe"
      purpose: "Rahmenfarbe der Personenkarte"
    person_card_border_width_px:
      type: "integer"
      default: 2
      purpose: "Rahmendicke der Personenkarte"
    person_card_gap_px:
      type: "integer"
      default: 10
      purpose: "Abstand zwischen Personen"
  admin_settings_ui:
    structure:
      - "Einfache Ansicht und Expertenmodus"
      - "Einstellungen sind als aufklappbare Gruppen/Akkordeons organisiert"
      - "Alltagsfunktionen wie Kostenwarnung und Mitgliedernachrichten bleiben in der einfachen Ansicht sichtbar"
      - "SumUp Solo Self-Checkout zeigt ENV-Konfigurationsstatus und Reader-Test."
    live_previews:
      - "Strichlisten-/Personenkarten-Vorschau mit Max Mustermann und Testmengen"
      - "Kostenwarnung/Zahlungserinnerung als Badge in der Personenkarten-Vorschau"
      - "Sync-Indikator-Vorschau"
      - "Popup-Vorschau sollte künftig echte Dialog-Komponente/Fake-Daten nutzen statt separater Fake-Struktur"

sqlite_schema:
  pragmas:
    journal_mode: "WAL"
    foreign_keys: "ON pro Verbindung via get_conn/configure_connection"
    busy_timeout: "15000 ms pro Verbindung"
  migration_strategy:
    - "CREATE TABLE IF NOT EXISTS beim Startup"
    - "add_column_if_missing für neue Spalten"
    - "alte drinks/orders werden in items/order_lines migriert, falls vorhanden"
    - "fehlende EK-Snapshots werden kontrolliert nachgefüllt, Systemartikel bleibt EK=0"
  tables:
    settings:
      purpose: "Key-value Konfiguration"
      columns:
        key: {type: "TEXT", constraints: "PRIMARY KEY"}
        value: {type: "TEXT", constraints: "NOT NULL"}
        updated_at: {type: "TEXT", constraints: "NOT NULL"}
    people:
      purpose: "Personen/Mitglieder/Kunden"
      columns:
        id: {type: "INTEGER", constraints: "PRIMARY KEY AUTOINCREMENT"}
        name: {type: "TEXT", constraints: "UNIQUE NOT NULL", meaning: "kompatibler Vollname"}
        first_name: {type: "TEXT", constraints: "NOT NULL DEFAULT ''"}
        last_name: {type: "TEXT", constraints: "NOT NULL DEFAULT ''"}
        active: {type: "INTEGER", constraints: "NOT NULL DEFAULT 1"}
        archived_at: {type: "TEXT", constraints: "nullable"}
        created_at: {type: "TEXT", constraints: "nullable/filled for new records"}
    items:
      purpose: "Artikel/Getränke und Systemartikel"
      columns:
        id: {type: "INTEGER", constraints: "PRIMARY KEY AUTOINCREMENT"}
        name: {type: "TEXT", constraints: "UNIQUE NOT NULL"}
        short_label: {type: "TEXT", constraints: "NOT NULL"}
        price_eur: {type: "REAL", constraints: "NOT NULL DEFAULT 0"}
        purchase_price_eur: {type: "REAL", constraints: "NOT NULL DEFAULT 0"}
        active: {type: "INTEGER", constraints: "NOT NULL DEFAULT 1"}
        admin_only: {type: "INTEGER", constraints: "NOT NULL DEFAULT 0"}
        sort_order: {type: "INTEGER", constraints: "NOT NULL DEFAULT 100"}
        archived_at: {type: "TEXT", constraints: "nullable"}
        created_at: {type: "TEXT", constraints: "NOT NULL"}
    order_lines:
      purpose: "Offene Rechnungsposten und aktuelle Strichliste"
      grouping_logic: >-
        Neue Buchung wird mit bestehender Zeile zusammengeführt, wenn person_id, item_id,
        unit_price_eur, unit_purchase_price_eur, item_name_snapshot,
        item_short_label_snapshot, admin_only_snapshot, consumed_date und event_open=1 übereinstimmen.
      columns:
        id: {type: "INTEGER", constraints: "PRIMARY KEY AUTOINCREMENT"}
        person_id: {type: "INTEGER", constraints: "NOT NULL REFERENCES people(id)"}
        item_id: {type: "INTEGER", constraints: "nullable REFERENCES items(id)"}
        quantity: {type: "INTEGER", constraints: "NOT NULL DEFAULT 0"}
        unit_price_eur: {type: "REAL", constraints: "NOT NULL"}
        unit_purchase_price_eur: {type: "REAL", constraints: "NOT NULL DEFAULT 0"}
        item_name_snapshot: {type: "TEXT", constraints: "NOT NULL"}
        item_short_label_snapshot: {type: "TEXT", constraints: "NOT NULL"}
        admin_only_snapshot: {type: "INTEGER", constraints: "NOT NULL DEFAULT 0"}
        consumed_date: {type: "TEXT", constraints: "NOT NULL", format: "YYYY-MM-DD"}
        event_open: {type: "INTEGER", constraints: "NOT NULL DEFAULT 1"}
        created_at: {type: "TEXT", constraints: "NOT NULL"}
        updated_at: {type: "TEXT", constraints: "NOT NULL"}
    change_requests:
      purpose: "Löschanfragen normaler Benutzer"
      statuses: ["PENDING", "APPROVED", "REJECTED"]
      columns:
        id: {type: "INTEGER", constraints: "PRIMARY KEY AUTOINCREMENT"}
        person_id: {type: "INTEGER", constraints: "NOT NULL REFERENCES people(id)"}
        order_line_id: {type: "INTEGER", constraints: "NOT NULL REFERENCES order_lines(id)"}
        item_id: {type: "INTEGER", constraints: "nullable REFERENCES items(id)"}
        quantity_to_remove: {type: "INTEGER", constraints: "NOT NULL"}
        reason: {type: "TEXT", constraints: "nullable"}
        status: {type: "TEXT", constraints: "NOT NULL DEFAULT 'PENDING'"}
        requested_at: {type: "TEXT", constraints: "NOT NULL"}
        decided_at: {type: "TEXT", constraints: "nullable"}
    round_requests:
      purpose: "Audit-/Kompatibilitätstabelle für bezahlte Runden; neue Runden werden sofort APPROVED geschrieben"
      statuses: ["PENDING", "APPROVED", "REJECTED"]
      columns:
        id: {type: "INTEGER", constraints: "PRIMARY KEY AUTOINCREMENT"}
        person_id: {type: "INTEGER", constraints: "NOT NULL REFERENCES people(id)"}
        item_id: {type: "INTEGER", constraints: "nullable REFERENCES items(id)"}
        quantity: {type: "INTEGER", constraints: "NOT NULL DEFAULT 1"}
        reason: {type: "TEXT", constraints: "nullable"}
        status: {type: "TEXT", constraints: "NOT NULL DEFAULT 'PENDING'"}
        requested_at: {type: "TEXT", constraints: "NOT NULL"}
        decided_at: {type: "TEXT", constraints: "nullable"}
    member_messages:
      purpose: "Admin-Nachrichten, die ausgewaehlten Mitgliedern im Personen-Popup angezeigt werden"
      columns:
        id: {type: "INTEGER", constraints: "PRIMARY KEY AUTOINCREMENT"}
        title: {type: "TEXT", constraints: "nullable"}
        message: {type: "TEXT", constraints: "NOT NULL"}
        active: {type: "INTEGER", constraints: "NOT NULL DEFAULT 1"}
        created_at: {type: "TEXT", constraints: "NOT NULL"}
        archived_at: {type: "TEXT", constraints: "nullable"}
    member_message_recipients:
      purpose: "Empfaenger und individuelle Lesebestaetigung je Nachricht"
      columns:
        message_id: {type: "INTEGER", constraints: "NOT NULL REFERENCES member_messages(id) ON DELETE CASCADE"}
        person_id: {type: "INTEGER", constraints: "NOT NULL REFERENCES people(id)"}
        acknowledged_at: {type: "TEXT", constraints: "nullable"}
      primary_key: ["message_id", "person_id"]
    transactions:
      purpose: "Haupt-Auditlog / Verlauf"
      immutability: "niemals alte Einträge überschreiben/löschen für normale Korrekturen"
      columns:
        id: {type: "INTEGER", constraints: "PRIMARY KEY AUTOINCREMENT"}
        person_id: {type: "INTEGER", constraints: "nullable REFERENCES people(id)"}
        type: {type: "TEXT", constraints: "NOT NULL"}
        total: {type: "REAL", constraints: "NOT NULL"}
        details: {type: "TEXT", constraints: "nullable"}
        timestamp: {type: "TEXT", constraints: "NOT NULL", format: "YYYY-MM-DD HH:MM:SS"}
      known_types:
        - "CONSUME"
        - "CHANGE_REQUEST"
        - "CHANGE_APPROVED"
        - "CHANGE_REJECTED"
        - "ROUND_REQUEST"
        - "ROUND_REQUEST_APPROVED"
        - "ROUND_REQUEST_REJECTED"
        - "PAID_CASH"
        - "PAID_SUMUP"
        - "SUMUP_PAYMENT_FAILED"
        - "SUMUP_PAYMENT_CANCELLED"
        - "SUMUP_PAYMENT_TIMEOUT"
        - "SUMUP_PAYMENT_UNKNOWN"
        - "SUMUP_PAYMENT_ERROR"
        - "SUMUP_PAYMENT_MISMATCH"
        - "SUMUP_PAYMENT_STALE"
        - "ADMIN_ADJUSTMENT"
        - "ROUND_DEDUCTED"
        - "CASHUP"
        - "DEBUG_TEST_DATA"
        - "PERSON_CREATED"
        - "PERSON_UPDATED"
        - "PERSON_DELETED"
        - "ITEM_CREATED"
        - "ITEM_UPDATED"
        - "ITEM_DELETED"
        - "SETTINGS_UPDATED"
        - "CONNECTION_LOST"
        - "CONNECTION_RESTORED"
        - "SYNC_COMPLETED"
        - "MEMBER_MESSAGE_CREATED"
        - "MEMBER_MESSAGE_ARCHIVED"
        - "MEMBER_MESSAGE_ACK"
    client_operations:
      purpose: "Idempotenz fuer nachtraeglich synchronisierte Offline-Getraenkebuchungen"
      columns:
        client_operation_id: {type: "TEXT", constraints: "PRIMARY KEY"}
        endpoint: {type: "TEXT", constraints: "NOT NULL"}
        transaction_id: {type: "INTEGER", constraints: "nullable REFERENCES transactions(id)"}
        client_time: {type: "TEXT", constraints: "nullable"}
        device_info: {type: "TEXT", constraints: "nullable"}
        created_at: {type: "TEXT", constraints: "NOT NULL"}
    self_payment_sessions:
      purpose: "Idempotente SumUp-Selbstzahlung und Sperre gegen Doppelbuchungen/Parallelbuchungen"
      statuses: ["CREATED", "SENT_TO_READER", "PENDING", "PAID", "FAILED", "CANCELLED", "TIMEOUT", "UNKNOWN", "EXPIRED"]
      columns:
        id: {type: "INTEGER", constraints: "PRIMARY KEY AUTOINCREMENT"}
        person_id: {type: "INTEGER", constraints: "NOT NULL REFERENCES people(id)"}
        client_payment_id: {type: "TEXT", constraints: "UNIQUE nullable, vom iPad erzeugt"}
        status: {type: "TEXT", constraints: "NOT NULL"}
        amount_eur: {type: "REAL", constraints: "NOT NULL"}
        amount_cents: {type: "INTEGER", constraints: "NOT NULL"}
        currency: {type: "TEXT", constraints: "NOT NULL DEFAULT EUR"}
        provider: {type: "TEXT", constraints: "NOT NULL DEFAULT sumup"}
        provider_checkout_id: {type: "TEXT", constraints: "nullable"}
        revision: {type: "TEXT", constraints: "NOT NULL"}
        terminal_result: {type: "TEXT", constraints: "nullable JSON"}
        terminal_reference: {type: "TEXT", constraints: "nullable"}
        raw_response: {type: "TEXT", constraints: "nullable JSON"}
        error: {type: "TEXT", constraints: "nullable"}
        transaction_id: {type: "INTEGER", constraints: "nullable REFERENCES transactions(id)"}
        created_at: {type: "TEXT", constraints: "NOT NULL"}
        updated_at: {type: "TEXT", constraints: "NOT NULL"}
        completed_at: {type: "TEXT", constraints: "nullable"}
    transaction_items:
      purpose: "Mengen-/Preisdetails für Auswertungen"
      columns:
        id: {type: "INTEGER", constraints: "PRIMARY KEY AUTOINCREMENT"}
        transaction_id: {type: "INTEGER", constraints: "NOT NULL REFERENCES transactions(id)"}
        person_id: {type: "INTEGER", constraints: "nullable REFERENCES people(id)"}
        item_id: {type: "INTEGER", constraints: "nullable REFERENCES items(id)"}
        item_name_snapshot: {type: "TEXT", constraints: "NOT NULL"}
        item_short_label_snapshot: {type: "TEXT", constraints: "NOT NULL"}
        quantity: {type: "INTEGER", constraints: "NOT NULL", meaning: "kann negativ sein"}
        unit_price_eur: {type: "REAL", constraints: "NOT NULL"}
        unit_purchase_price_eur: {type: "REAL", constraints: "NOT NULL DEFAULT 0"}
        total_eur: {type: "REAL", constraints: "NOT NULL"}
        purchase_total_eur: {type: "REAL", constraints: "NOT NULL DEFAULT 0"}
        profit_eur: {type: "REAL", constraints: "NOT NULL DEFAULT 0"}
        kind: {type: "TEXT", constraints: "NOT NULL"}
        timestamp: {type: "TEXT", constraints: "NOT NULL"}
    round_events:
      purpose: "Zusatzdaten für Rundenabzug/Gewinnberechnung"
      columns:
        id: {type: "INTEGER", constraints: "PRIMARY KEY AUTOINCREMENT"}
        transaction_id: {type: "INTEGER", constraints: "nullable REFERENCES transactions(id)"}
        timestamp: {type: "TEXT", constraints: "NOT NULL"}
        round_price_eur: {type: "REAL", constraints: "NOT NULL"}
        deducted_vk_eur: {type: "REAL", constraints: "NOT NULL"}
        deducted_purchase_eur: {type: "REAL", constraints: "NOT NULL"}
        profit_vs_purchase_eur: {type: "REAL", constraints: "NOT NULL"}
        profit_vs_retail_eur: {type: "REAL", constraints: "NOT NULL"}
        details: {type: "TEXT", constraints: "nullable"}
  indexes:
    - "idx_transaction_items_kind_timestamp ON transaction_items(kind, timestamp)"
    - "idx_transaction_items_timestamp ON transaction_items(timestamp)"
    - "idx_order_lines_quantity_event ON order_lines(quantity, event_open)"
    - "idx_order_lines_person_quantity_event ON order_lines(person_id, quantity, event_open)"
    - "idx_round_events_timestamp ON round_events(timestamp)"
    - "idx_transactions_type_timestamp ON transactions(type, timestamp)"
    - "idx_transactions_person_timestamp ON transactions(person_id, timestamp)"
    - "idx_change_requests_status ON change_requests(status)"
    - "idx_change_requests_line_status ON change_requests(order_line_id, status)"
    - "idx_round_requests_status ON round_requests(status)"
    - "idx_round_requests_person_status ON round_requests(person_id, status)"
    - "idx_member_messages_active ON member_messages(active, archived_at)"
    - "idx_member_message_recipients_person_ack ON member_message_recipients(person_id, acknowledged_at)"
    - "idx_member_message_recipients_message ON member_message_recipients(message_id)"
    - "idx_self_payment_sessions_person_status ON self_payment_sessions(person_id, status, updated_at)"
    - "idx_self_payment_sessions_status_updated ON self_payment_sessions(status, updated_at)"
    - "idx_self_payment_sessions_client_payment_id UNIQUE ON self_payment_sessions(client_payment_id)"
    - "idx_self_payment_sessions_provider_checkout ON self_payment_sessions(provider, provider_checkout_id)"

api:
  style: "JSON REST"
  auth:
    mechanism: "Admin-PIN im Request-Body"
    sessions: false
    frontend_storage: "sessionStorage adminPin"
    login_rate_limit: "8 Versuche pro Client in 5 Minuten"
  static_routes:
    - {method: "GET", path: "/", purpose: "Kassenansicht"}
    - {method: "GET", path: "/admin", purpose: "Adminseite"}
    - {method: "GET", path: "/kassa", purpose: "versteckte mobile Kassierseite fuer Handy-Hochformat; kein Button in der Standardansicht"}
    - {method: "GET", path: "/self-pay", purpose: "Mitglieder-Selbstzahlung per SumUp; kein Zugriff auf /kassa erforderlich"}
    - {method: "GET", path: "/bezahlen", purpose: "Alias fuer /self-pay"}
    - {method: "GET", path: "/manifest.webmanifest", purpose: "PWA manifest"}
    - {method: "GET", path: "/kassa.webmanifest", purpose: "PWA manifest fuer interne Kassa"}
    - {method: "GET", path: "/self-pay.webmanifest", purpose: "PWA manifest fuer Mitglieder-Selbstzahlung"}
    - {method: "GET", path: "/service-worker.js", purpose: "PWA service worker"}
    - {method: "GET", path: "/icon.svg", purpose: "Icon SVG"}
    - {method: "GET", path: "/icon-192.png", purpose: "PWA Icon"}
    - {method: "GET", path: "/icon-512.png", purpose: "PWA Icon"}
  public_routes:
    - {method: "GET", path: "/health", returns: "status, environment, DB info, people count; DB-Pfad in production redacted"}
    - {method: "GET", path: "/api/sync-status", returns: "server timestamp/version-like sync info"}
    - {method: "POST", path: "/api/client-event", purpose: "Online/offline/sync Ereignisse; Logging nur DevMode"}
    - {method: "GET", path: "/api/config", returns: "Settings, app info, items/user_items"}
    - {method: "GET", path: "/api/people", returns: "aktive Personen mit offenen Posten, Summen, Strichliste, pending requests"}
    - {method: "GET", path: "/api/kassa/people", returns: "kompakte offene Personen fuer die mobile Kassa: id, Name, offene Striche, Betrag"}
    - {method: "GET", path: "/api/kassa/person/{person_id}", returns: "mobile Kassa-Detail mit gruppierten Getraenken, Betrag, can_pay und revision"}
    - {method: "GET", path: "/api/self-pay/config", returns: "oeffentliche Self-Pay-Konfiguration ohne SumUp API Key"}
    - {method: "GET", path: "/api/self-pay/people", returns: "offene Personen fuer Mitglieder-Selbstzahlung"}
    - {method: "GET", path: "/api/self-pay/person/{person_id}", returns: "offene Posten, can_self_pay und revision fuer SumUp-Zahlung"}
    - {method: "POST", path: "/api/self-pay/pay", body: "SelfPayRequest", purpose: "idempotenter SumUp-Zahlungsstart mit client_payment_id"}
    - {method: "GET", path: "/api/self-pay/payment/{client_payment_id}", returns: "Status/Wiederaufnahme: created, sent_to_reader, pending, paid, failed, cancelled, timeout, unknown, expired"}
    - {method: "POST", path: "/api/add-drink", body: "AddDrinkRequest", purpose: "Konsum buchen; optional idempotente Offline-Nachsynchronisierung ueber client_operation_id"}
    - {method: "POST", path: "/api/edit-request", body: "EditRequestIn", purpose: "Löschanfrage stellen"}
    - {method: "POST", path: "/api/round-request", body: "RoundRequestIn", purpose: "Runde zahlen; wird sofort als APPROVED protokolliert und gebucht"}
    - {method: "POST", path: "/api/member-message/ack", body: "MemberMessageAckRequest", purpose: "Mitglied bestaetigt eine angezeigte Nachricht; danach fuer diese Person ausgeblendet"}
  admin_routes:
    - {method: "POST", path: "/api/admin-login", body: "PinRequest", purpose: "PIN prüfen"}
    - {method: "POST", path: "/api/admin/overview", body: "PinRequest", purpose: "Admin-Dashboard-Daten"}
    - {method: "POST", path: "/api/admin/member-message/create", body: "AdminMemberMessageCreate", purpose: "Nachricht an ausgewaehlte aktive Mitglieder anlegen"}
    - {method: "POST", path: "/api/admin/member-message/archive", body: "AdminMemberMessageArchive", purpose: "Mitgliedernachricht archivieren"}
    - {method: "POST", path: "/api/admin/change-request/decide", body: "AdminChangeRequestDecision", purpose: "Löschanfrage entscheiden"}
    - {method: "POST", path: "/api/admin/round-request/decide", body: "AdminRoundRequestDecision", purpose: "Legacy-/Adminentscheidung alter Rundenanfragen; neue Runden brauchen keine Genehmigung"}
    - {method: "POST", path: "/api/pay", body: "PayRequest", purpose: "Barzahlung buchen"}
    - {method: "POST", path: "/api/kassa/pay", body: "KassaPayRequest", purpose: "mobile Kassa-Barzahlung mit PIN und expected_revision-Konfliktschutz"}
    - {method: "POST", path: "/api/admin/adjust-drink", body: "AdminAdjustItemRequest", purpose: "Admin +1/-1 Korrektur"}
    - {method: "POST", path: "/api/admin/add-round-item", body: "PinRequest/person", purpose: "Admin bucht Runde direkt"}
    - {method: "POST", path: "/api/admin/cashup-preview", body: "CashupRequest", purpose: "Kassensturz-Vorschau"}
    - {method: "POST", path: "/api/admin/cashup", body: "CashupRequest", purpose: "Kassensturz ausführen"}
    - {method: "POST", path: "/api/deduct-round-preview", body: "PinRequest", purpose: "Runde-abziehen Vorschau"}
    - {method: "POST", path: "/api/deduct-round", body: "PinRequest", purpose: "Runde abziehen"}
    - {method: "POST", path: "/api/debug/add-test-data", body: "PinRequest", purpose: "Testdaten nur development"}
    - {method: "POST", path: "/api/admin/people/create", body: "AdminPersonCreate", purpose: "Person anlegen"}
    - {method: "POST", path: "/api/admin/people/update", body: "AdminPersonUpdate", purpose: "Person ändern"}
    - {method: "POST", path: "/api/admin/people/delete", body: "AdminPersonDelete", purpose: "Person archivieren"}
    - {method: "POST", path: "/api/admin/drinks/create", body: "AdminItemCreate", purpose: "Artikel anlegen"}
    - {method: "POST", path: "/api/admin/drinks/update", body: "AdminItemUpdate", purpose: "Artikel ändern"}
    - {method: "POST", path: "/api/admin/drinks/delete", body: "AdminItemDelete", purpose: "Artikel archivieren"}
    - {method: "POST", path: "/api/admin/settings/update", body: "SettingsUpdateRequest", purpose: "Einstellungen ändern"}
    - {method: "POST", path: "/api/admin/sumup/status", body: "PinRequest", purpose: "SumUp Readerstatus testen"}
    - {method: "POST", path: "/api/admin/sumup/readers", body: "PinRequest", purpose: "Gekoppelte SumUp Reader listen"}
    - {method: "POST", path: "/api/admin/sumup/pair-reader", body: "SumUpPairReaderRequest", purpose: "SumUp Solo per Pairing-Code koppeln"}
    - {method: "POST", path: "/api/admin/transactions/filter", body: "TransactionFilterRequest", purpose: "Verlauf filtern"}
    - {method: "POST", path: "/api/admin/transactions", body: "PinRequest", purpose: "letzte Transaktionen"}
    - {method: "GET", path: "/api/transactions?pin=...", purpose: "PIN-pflichtige Kompatibilitäts-/Debugroute; Verlauf nicht mehr öffentlich"}
  exports_and_reports:
    report_preview:
      path: "/api/admin/report/preview"
      report_types: ["consumption", "event_consumption", "revenue", "profit", "rounds"]
      group_by: ["none", "date", "person", "item", "type", "item_person", "item_date", "person_date", "item_person_date"]
    csv_exports:
      - "/api/admin/export/report"
      - "/api/admin/export/transactions"
      - "/api/admin/export/open-balances"
      - "/api/admin/export/open-lines"
