<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kassa">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="/kassa.webmanifest">
  <link rel="apple-touch-icon" href="/kassa-icon.png">
  <title>Kassa</title>
  <style>
    :root {
      --bg:#f5f7fb;
      --panel:#ffffff;
      --ink:#111827;
      --muted:#64748b;
      --line:#dbe3ee;
      --blue:#2563eb;
      --green:#16a34a;
      --green-dark:#0f8a3c;
      --yellow:#fbbf24;
      --danger:#dc2626;
      --shadow:0 14px 34px rgba(15,23,42,.12);
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--ink);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button, input { font:inherit; }
    button {
      border:0;
      border-radius:8px;
      min-height:44px;
      padding:10px 14px;
      font-weight:850;
      cursor:pointer;
    }
    button:disabled { opacity:.55; cursor:wait; }
    .app {
      width:min(100%,520px);
      min-height:100vh;
      margin:0 auto;
      background:linear-gradient(180deg,#ffffff 0,#f5f7fb 48%);
      display:flex;
      flex-direction:column;
    }
    .topbar {
      position:sticky;
      top:0;
      z-index:10;
      padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
      background:rgba(255,255,255,.94);
      border-bottom:1px solid var(--line);
      backdrop-filter:blur(14px);
    }
    .topline { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    h1 { margin:0; font-size:24px; line-height:1; letter-spacing:0; }
    .sub { margin-top:4px; color:var(--muted); font-size:13px; }
    .icon-btn {
      width:44px;
      height:44px;
      padding:0;
      border:1px solid var(--line);
      background:#fff;
      color:var(--ink);
      display:grid;
      place-items:center;
      font-size:20px;
    }
    .content {
      flex:1;
      display:flex;
      flex-direction:column;
      gap:10px;
      padding:12px 12px calc(18px + env(safe-area-inset-bottom));
    }
    .pin-card {
      margin:auto 12px;
      padding:22px;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:8px;
      box-shadow:var(--shadow);
      display:grid;
      gap:14px;
    }
    .pin-card h1 { font-size:30px; }
    .pin-card p { margin:0; color:var(--muted); line-height:1.35; }
    .pin-input, .search {
      width:100%;
      border:1px solid var(--line);
      background:#fff;
      color:var(--ink);
      border-radius:8px;
      min-height:50px;
      padding:12px 14px;
      outline:none;
      font-size:17px;
    }
    .pin-input:focus, .search:focus { border-color:#93c5fd; box-shadow:0 0 0 4px rgba(37,99,235,.12); }
    .primary {
      background:linear-gradient(180deg,#22c55e,#16a34a);
      color:#fff;
      box-shadow:0 10px 22px rgba(22,163,74,.2);
    }
    .secondary {
      background:#e8eef7;
      color:#1f2937;
      border:1px solid #d3deec;
    }
    .danger {
      background:#fff1f2;
      color:#991b1b;
      border:1px solid #fecdd3;
    }
    .search-wrap {
      position:sticky;
      top:calc(64px + env(safe-area-inset-top));
      z-index:8;
      padding-bottom:2px;
      background:linear-gradient(180deg,#f9fbff 0,#f5f7fb 100%);
    }
    .list-summary {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:7px;
      margin-top:8px;
    }
    .summary-tile {
      min-width:0;
      padding:8px 9px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#fff;
      box-shadow:0 3px 10px rgba(15,23,42,.04);
    }
    .summary-label {
      color:var(--muted);
      font-size:10px;
      font-weight:850;
      letter-spacing:0;
      text-transform:uppercase;
    }
    .summary-value {
      margin-top:2px;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
      font-size:16px;
      line-height:1.12;
      font-weight:950;
    }
    .person-list { display:grid; gap:8px; }
    .person-row {
      width:100%;
      display:grid;
      grid-template-columns:1fr auto;
      align-items:center;
      gap:10px;
      min-height:58px;
      padding:10px 12px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:8px;
      text-align:left;
      box-shadow:0 4px 12px rgba(15,23,42,.04);
    }
    .person-name {
      min-width:0;
      font-size:17px;
      font-weight:850;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }
    .person-meta { margin-top:2px; color:var(--muted); font-size:12px; font-weight:650; }
    .amount { font-size:18px; font-weight:950; white-space:nowrap; }
    .empty {
      padding:28px 18px;
      text-align:center;
      color:var(--muted);
      background:#fff;
      border:1px dashed #cbd5e1;
      border-radius:8px;
    }
    .detail-head {
      background:#fff;
      border:1px solid var(--line);
      border-radius:8px;
      padding:14px;
      box-shadow:0 8px 20px rgba(15,23,42,.06);
    }
    .detail-name { font-size:24px; font-weight:950; line-height:1.08; }
    .detail-total { margin-top:8px; font-size:38px; line-height:1; font-weight:1000; color:#0f172a; }
    .detail-note { margin-top:6px; color:var(--muted); font-size:13px; }
    .line-list {
      display:grid;
      gap:7px;
      margin-bottom:92px;
    }
    .line-row {
      display:grid;
      grid-template-columns:44px 1fr auto;
      gap:10px;
      align-items:center;
      background:#fff;
      border:1px solid var(--line);
      border-radius:8px;
      padding:10px;
    }
    .qty {
      width:38px;
      height:38px;
      display:grid;
      place-items:center;
      border-radius:8px;
      background:#eef6ff;
      color:#1d4ed8;
      font-weight:950;
    }
    .item { min-width:0; font-weight:850; }
    .item small { display:block; margin-top:2px; color:var(--muted); font-weight:650; }
    .line-total { font-weight:950; white-space:nowrap; }
    .detail-actions {
      position:fixed;
      left:50%;
      bottom:0;
      z-index:20;
      width:min(100%,520px);
      transform:translateX(-50%);
      display:grid;
      grid-template-columns:.9fr .9fr 1.35fr;
      gap:9px;
      padding:10px 12px calc(10px + env(safe-area-inset-bottom));
      background:rgba(245,247,251,.92);
      border-top:1px solid var(--line);
      backdrop-filter:blur(14px);
    }
    .pay-now { min-height:56px; font-size:19px; }
    dialog.confirm-dialog {
      border:0;
      padding:0;
      width:min(calc(100vw - 28px),460px);
      border-radius:8px;
      background:transparent;
      position:fixed;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      margin:0;
      box-shadow:0 22px 60px rgba(15,23,42,.28);
    }
    dialog.confirm-dialog::backdrop { background:rgba(15,23,42,.48); }
    body.modal-open { overflow:hidden; }
    .confirm-card {
      background:#fff;
      border-radius:8px;
      padding:18px;
      border:1px solid var(--line);
      display:grid;
      gap:12px;
    }
    .confirm-card h2 { margin:0; font-size:24px; line-height:1.1; }
    .confirm-card p { margin:0; color:var(--muted); line-height:1.35; }
    .confirm-total {
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:baseline;
      padding:12px;
      border-radius:8px;
      background:#f8fafc;
      font-weight:950;
    }
    .confirm-total strong { font-size:24px; }
    .confirm-actions {
      display:grid;
      grid-template-columns:1fr 1.25fr;
      gap:9px;
    }
    dialog.history-dialog { width:min(calc(100vw - 28px),520px); }
    .history-card { max-height:calc(100dvh - 28px); }
    .history-head {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    .history-close-icon {
      flex:0 0 auto;
      width:42px;
      height:42px;
      min-height:42px;
      padding:0;
      border-radius:8px;
      background:#f1f5f9;
      color:#0f172a;
      border:1px solid var(--line);
      font-size:24px;
      line-height:1;
    }
    .history-list {
      display:grid;
      gap:8px;
      max-height:min(58vh,520px);
      overflow:auto;
      padding-right:2px;
    }
    .history-row {
      display:grid;
      grid-template-columns:54px 1fr;
      gap:10px;
      align-items:center;
      padding:10px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#f8fafc;
    }
    .history-row.consume { border-color:#bbf7d0; background:#f7fef9; }
    .history-row.deduction { border-color:#fecdd3; background:#fff1f2; }
    .history-qty {
      width:46px;
      min-height:38px;
      display:grid;
      place-items:center;
      border-radius:8px;
      background:#dcfce7;
      color:#166534;
      font-weight:950;
    }
    .history-row.deduction .history-qty { background:#fee2e2; color:#991b1b; }
    .history-body { min-width:0; }
    .history-type {
      color:var(--muted);
      font-size:11px;
      font-weight:950;
      letter-spacing:0;
      text-transform:uppercase;
    }
    .history-row.deduction .history-type { color:#991b1b; }
    .history-product {
      margin-top:2px;
      font-size:16px;
      font-weight:900;
      line-height:1.15;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .history-date {
      margin-top:3px;
      color:var(--muted);
      font-size:13px;
      font-weight:700;
    }
    .history-footer {
      grid-template-columns:1fr;
    }
    .warning {
      border:1px solid #fde68a;
      background:#fffbeb;
      color:#92400e;
      border-radius:8px;
      padding:10px 12px;
      font-size:13px;
      line-height:1.35;
      font-weight:750;
    }
    .status {
      position:fixed;
      left:50%;
      bottom:calc(14px + env(safe-area-inset-bottom));
      z-index:50;
      max-width:min(92%,480px);
      transform:translateX(-50%) translateY(16px);
      opacity:0;
      pointer-events:none;
      background:#0f172a;
      color:#fff;
      border-radius:999px;
      padding:10px 14px;
      font-size:14px;
      font-weight:800;
      transition:opacity .18s ease, transform .18s ease;
      box-shadow:0 10px 24px rgba(15,23,42,.24);
    }
    .status.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .hidden { display:none !important; }
    @media (max-width:370px) {
      .amount { font-size:16px; }
      .detail-total { font-size:34px; }
      .person-name { font-size:16px; }
      .detail-actions { grid-template-columns:1fr; }
      .line-list { margin-bottom:210px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <section id="pinView" class="pin-card">
      <div>
        <h1>Kassa</h1>
        <p>Offene Zahlungen</p>
      </div>
      <form id="pinForm">
        <input id="pinInput" class="pin-input" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Admin-PIN">
        <button id="pinButton" class="primary" type="submit" style="width:100%; margin-top:10px">Kassa entsperren</button>
      </form>
    </section>

    <section id="appView" class="hidden">
      <header class="topbar">
        <div class="topline">
          <div>
            <h1 id="pageTitle">Kassa</h1>
            <div id="pageSub" class="sub">Namen und offene Beträge</div>
          </div>
          <button id="refreshButton" class="icon-btn" type="button" title="Aktualisieren">↻</button>
        </div>
      </header>

      <main id="listView" class="content">
        <div class="search-wrap">
          <input id="searchInput" class="search" type="search" placeholder="Name suchen..." autocomplete="off">
          <div id="listSummary" class="list-summary" aria-live="polite"></div>
        </div>
        <div id="personList" class="person-list"></div>
      </main>

      <main id="detailView" class="content hidden">
        <section id="detailHead" class="detail-head"></section>
        <div id="detailWarning" class="warning hidden"></div>
        <section id="lineList" class="line-list"></section>
        <div class="detail-actions">
          <button id="cancelButton" class="secondary" type="button">Abbrechen</button>
          <button id="historyButton" class="secondary" type="button">Verlauf</button>
          <button id="payButton" class="primary pay-now" type="button">Zahlung buchen</button>
        </div>
      </main>
    </section>
  </div>
  <div id="status" class="status"></div>
  <dialog id="payConfirmDialog" class="confirm-dialog">
    <section class="confirm-card">
      <div>
        <h2 id="confirmTitle">Zahlung bestätigen</h2>
        <p id="confirmText"></p>
      </div>
      <div class="confirm-total"><span>Gesamt</span><strong id="confirmTotal">€ 0,00</strong></div>
      <div class="confirm-actions">
        <button id="confirmCancelButton" class="secondary" type="button">Abbrechen</button>
        <button id="confirmPayButton" class="primary" type="button">Buchen</button>
      </div>
    </section>
  </dialog>
  <dialog id="historyDialog" class="confirm-dialog history-dialog">
    <section class="confirm-card history-card">
      <div class="history-head">
        <div>
          <h2 id="historyTitle">Verlauf</h2>
          <p id="historySub"></p>
        </div>
        <button id="historyCloseIcon" class="history-close-icon" type="button" title="Schließen">&times;</button>
      </div>
      <div id="historyList" class="history-list"></div>
      <div class="confirm-actions history-footer">
        <button id="historyCloseButton" class="secondary" type="button">Schließen</button>
      </div>
    </section>
  </dialog>

  <script>
    const state = {
      pin: sessionStorage.getItem('drinkPosKassaPin') || '',
      people: [],
      selected: null,
      listTimer: null,
      busy: false,
      historyBusy: false,
    };

    const el = id => document.getElementById(id);
    const money = value => new Intl.NumberFormat('de-AT', { style:'currency', currency:'EUR' }).format(Number(value || 0));
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));

    function syncModalOpen() {
      document.body.classList.toggle('modal-open', el('payConfirmDialog').open || el('historyDialog').open);
    }

    function showStatus(message, duration = 2300) {
      const box = el('status');
      box.textContent = message;
      box.classList.add('show');
      clearTimeout(showStatus.timer);
      showStatus.timer = setTimeout(() => box.classList.remove('show'), duration);
    }

    async function apiGet(url) {
      const res = await fetch(url, { cache:'no-store', headers:{ 'Cache-Control':'no-cache' } });
      return parseResponse(res);
    }

    async function apiPost(url, body) {
      const res = await fetch(url, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body:JSON.stringify(body || {}),
      });
      return parseResponse(res);
    }

    async function parseResponse(res) {
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const detail = data.detail;
        const message = typeof detail === 'string' ? detail : (detail?.message || 'Aktion fehlgeschlagen');
        const err = new Error(message);
        err.status = res.status;
        err.detail = detail;
        throw err;
      }
      return data;
    }

    function setUnlocked(unlocked) {
      el('pinView').classList.toggle('hidden', unlocked);
      el('appView').classList.toggle('hidden', !unlocked);
      if (unlocked) {
        loadPeople();
        startAutoRefresh();
      } else {
        stopAutoRefresh();
        el('pinInput').focus();
      }
    }

    async function unlockWithPin(pin) {
      el('pinButton').disabled = true;
      try {
        await apiPost('/api/admin-login', { pin });
        state.pin = pin;
        sessionStorage.setItem('drinkPosKassaPin', pin);
        setUnlocked(true);
        showStatus('Kassa entsperrt');
      } catch (err) {
        sessionStorage.removeItem('drinkPosKassaPin');
        state.pin = '';
        showStatus(err.message || 'PIN nicht korrekt');
      } finally {
        el('pinButton').disabled = false;
      }
    }

    async function loadPeople(silent = false) {
      if (!state.pin) return;
      try {
        const data = await apiGet('/api/kassa/people');
        state.people = data.people || [];
        renderPeople();
        if (!silent) showStatus('Aktualisiert', 1000);
      } catch (err) {
        if (!silent) showStatus(err.message || 'Kann nicht aktualisieren');
      }
    }

    function renderListSummary(people) {
      const totalItems = people.reduce((sum, person) => sum + Number(person.open_items || 0), 0);
      const totalEur = people.reduce((sum, person) => sum + Number(person.total_eur ?? person.total ?? 0), 0);
      el('listSummary').innerHTML = `
        <div class="summary-tile"><div class="summary-label">Personen</div><div class="summary-value">${people.length}</div></div>
        <div class="summary-tile"><div class="summary-label">Striche</div><div class="summary-value">${totalItems}</div></div>
        <div class="summary-tile"><div class="summary-label">Summe</div><div class="summary-value">${money(totalEur)}</div></div>
      `;
    }

    function renderPeople() {
      const term = el('searchInput').value.trim().toLowerCase();
      const list = el('personList');
      const people = state.people.filter(person => !term || person.name.toLowerCase().includes(term));
      renderListSummary(people);
      el('pageSub').textContent = term
        ? `${people.length} von ${state.people.length} offenen Rechnungen`
        : `${state.people.length} offene Rechnung${state.people.length === 1 ? '' : 'en'}`;
      if (!people.length) {
        list.innerHTML = `<div class="empty">${state.people.length ? 'Keine Treffer.' : 'Keine offenen Beträge.'}</div>`;
        return;
      }
      list.innerHTML = people.map(person => `
        <button class="person-row" type="button" data-person-id="${Number(person.id)}">
          <span>
            <span class="person-name">${escapeHtml(person.name)}</span>
            <span class="person-meta">${Number(person.open_items || 0)} offene Striche</span>
          </span>
          <span class="amount">${money(person.total_eur ?? person.total)}</span>
        </button>
      `).join('');
      list.querySelectorAll('.person-row').forEach(button => {
        button.addEventListener('click', () => openPerson(Number(button.dataset.personId)));
      });
    }

    async function openPerson(personId) {
      try {
        const detail = await apiGet(`/api/kassa/person/${personId}`);
        state.selected = detail;
        renderDetail();
      } catch (err) {
        showStatus(err.message || 'Person konnte nicht geladen werden');
      }
    }

    function renderDetail() {
      const person = state.selected;
      if (!person) return;
      el('listView').classList.add('hidden');
      el('detailView').classList.remove('hidden');
      el('pageTitle').textContent = 'Bezahlen';
      el('pageSub').textContent = person.name;
      el('detailHead').innerHTML = `
        <div class="detail-name">${escapeHtml(person.name)}</div>
        <div class="detail-total">${money(person.total_eur ?? person.total)}</div>
        <div class="detail-note">${Number(person.open_items || 0)} offene Striche</div>
      `;
      const warning = el('detailWarning');
      if (Number(person.pending_requests_count || 0) > 0) {
        warning.textContent = 'Offene Löschanfragen vorhanden. Bitte zuerst im Adminbereich entscheiden.';
        warning.classList.remove('hidden');
      } else {
        warning.classList.add('hidden');
      }
      const lines = person.lines || [];
      el('lineList').innerHTML = lines.length ? lines.map(line => `
        <div class="line-row">
          <div class="qty">${Number(line.quantity || 0)}×</div>
          <div class="item">${escapeHtml(line.item || line.name || '')}<small>${money(line.unit_price_eur)} pro Stück</small></div>
          <div class="line-total">${money(line.subtotal_eur)}</div>
        </div>
      `).join('') : '<div class="empty">Keine offenen Posten.</div>';
      el('historyButton').disabled = false;
      el('payButton').disabled = !person.can_pay || !lines.length;
    }

    function closeDetail() {
      closeHistoryDialog();
      state.selected = null;
      el('detailView').classList.add('hidden');
      el('listView').classList.remove('hidden');
      el('pageTitle').textContent = 'Kassa';
      loadPeople(true);
    }

    function renderHistoryRows(history) {
      const consumed = history
        .filter(entry => entry.direction !== 'deduction')
        .reduce((sum, entry) => sum + Math.abs(Number(entry.quantity || 0)), 0);
      const deducted = history
        .filter(entry => entry.direction === 'deduction')
        .reduce((sum, entry) => sum + Math.abs(Number(entry.quantity || 0)), 0);
      el('historySub').textContent = history.length ? `Konsum +${consumed}x, Abzug -${deducted}x` : '';
      if (!history.length) {
        el('historyList').innerHTML = '<div class="empty">Noch kein Verlauf vorhanden.</div>';
        return;
      }
      el('historyList').innerHTML = history.map(entry => {
        const direction = entry.direction === 'deduction' ? 'deduction' : 'consume';
        const typeLabel = entry.type_label || entry.type || '';
        const timestampLabel = entry.timestamp_label || '';
        const quantityLabel = entry.quantity_label || `${Number(entry.quantity || 0) > 0 ? '+' : ''}${Number(entry.quantity || 0)}x`;
        return `
          <div class="history-row ${direction}">
            <div class="history-qty">${escapeHtml(quantityLabel)}</div>
            <div class="history-body">
              <div class="history-type">${escapeHtml(typeLabel)} &middot; ${escapeHtml(timestampLabel)}</div>
              <div class="history-product">${escapeHtml(entry.product || entry.short_label || '')}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function openHistory() {
      const person = state.selected;
      if (!person || state.historyBusy) return;
      state.historyBusy = true;
      el('historyButton').disabled = true;
      el('historyTitle').textContent = `Verlauf ${person.name}`;
      el('historySub').textContent = 'Wird geladen...';
      el('historyList').innerHTML = '<div class="empty">Wird geladen...</div>';
      const dialog = el('historyDialog');
      if (!dialog.open) dialog.showModal();
      syncModalOpen();
      try {
        const data = await apiGet(`/api/kassa/person/${person.id}/history`);
        if (!state.selected || Number(state.selected.id) !== Number(person.id)) return;
        renderHistoryRows(data.history || []);
      } catch (err) {
        el('historySub').textContent = '';
        el('historyList').innerHTML = `<div class="empty">${escapeHtml(err.message || 'Verlauf konnte nicht geladen werden')}</div>`;
        showStatus(err.message || 'Verlauf konnte nicht geladen werden');
      } finally {
        state.historyBusy = false;
        if (state.selected) el('historyButton').disabled = false;
      }
    }

    function closeHistoryDialog() {
      const dialog = el('historyDialog');
      if (dialog.open) dialog.close();
    }

    async function refreshCurrent() {
      if (state.selected) await openPerson(state.selected.id);
      else await loadPeople();
    }

    async function paySelected() {
      const person = state.selected;
      if (!person || state.busy) return;
      state.busy = true;
      el('payButton').disabled = true;
      el('confirmPayButton').disabled = true;
      el('payButton').textContent = 'Bucht...';
      try {
        const data = await apiPost('/api/kassa/pay', {
          pin: state.pin,
          person_id: person.id,
          expected_revision: person.revision,
        });
        showStatus(`Bezahlt: ${money(data.total)}`);
        if (el('payConfirmDialog').open) el('payConfirmDialog').close();
        closeDetail();
      } catch (err) {
        if (el('payConfirmDialog').open) el('payConfirmDialog').close();
        if (err.status === 409 && err.detail?.current) {
          state.selected = err.detail.current;
          renderDetail();
          showStatus(err.message, 3600);
        } else if (err.status === 403) {
          sessionStorage.removeItem('drinkPosKassaPin');
          state.pin = '';
          setUnlocked(false);
          showStatus('Bitte neu entsperren');
        } else {
          showStatus(err.message || 'Zahlung fehlgeschlagen', 3600);
        }
      } finally {
        state.busy = false;
        el('confirmPayButton').disabled = false;
        el('payButton').textContent = 'Zahlung buchen';
        if (state.selected) el('payButton').disabled = !state.selected.can_pay;
      }
    }

    function requestPayConfirmation() {
      const person = state.selected;
      if (!person || state.busy || !person.can_pay) return;
      el('confirmTitle').textContent = `${person.name} bezahlen?`;
      el('confirmText').textContent = `${Number(person.open_items || 0)} offene Striche · ${money(person.total_eur ?? person.total)}`;
      el('confirmTotal').textContent = money(person.total_eur ?? person.total);
      const dialog = el('payConfirmDialog');
      dialog.showModal();
      syncModalOpen();
    }

    function startAutoRefresh() {
      stopAutoRefresh();
      state.listTimer = setInterval(() => {
        if (!document.hidden && !state.selected) loadPeople(true);
      }, 10000);
    }

    function stopAutoRefresh() {
      if (state.listTimer) clearInterval(state.listTimer);
      state.listTimer = null;
    }

    el('pinForm').addEventListener('submit', event => {
      event.preventDefault();
      const pin = el('pinInput').value.trim();
      if (!pin) return showStatus('Bitte PIN eingeben');
      unlockWithPin(pin);
    });
    el('searchInput').addEventListener('input', renderPeople);
    el('refreshButton').addEventListener('click', refreshCurrent);
    el('cancelButton').addEventListener('click', closeDetail);
    el('historyButton').addEventListener('click', openHistory);
    el('payButton').addEventListener('click', requestPayConfirmation);
    el('confirmCancelButton').addEventListener('click', () => el('payConfirmDialog').close());
    el('confirmPayButton').addEventListener('click', paySelected);
    el('historyCloseIcon').addEventListener('click', closeHistoryDialog);
    el('historyCloseButton').addEventListener('click', closeHistoryDialog);
    el('payConfirmDialog').addEventListener('close', syncModalOpen);
    el('historyDialog').addEventListener('close', syncModalOpen);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && state.pin) refreshCurrent();
    });

    if (state.pin) setUnlocked(true);
    else setUnlocked(false);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        const registration = await navigator.serviceWorker.register('/service-worker.js').catch(() => null);
        await registration?.update?.().catch(() => {});
      });
    }
  </script>
</body>
</html>
